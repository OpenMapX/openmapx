<svg
    viewBox="0 0 80 80"
    xmlns="http://www.w3.org/2000/svg"
    width="100%"
    height="100%"
  >
    <defs>
      <linearGradient id="weather-radar" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#43A047" stop-opacity="0.15" />
        <stop offset="40%" stop-color="#FDD835" stop-opacity="0.35" />
        <stop offset="70%" stop-color="#FF9800" stop-opacity="0.4" />
        <stop offset="100%" stop-color="#E53935" stop-opacity="0.35" />
      </linearGradient>
    </defs>
    <rect width="80" height="80" fill="#e4eef2" />
    <!-- subtle roads -->
    <line x1="0" y1="40" x2="80" y2="40" stroke="#d5dce6" stroke-width="2.5" />
    <line x1="32" y1="0" x2="32" y2="80" stroke="#d5dce6" stroke-width="2" />
    <!-- radar sweep overlay -->
    <ellipse cx="45" cy="35" rx="30" ry="25" fill="url(#weather-radar)" />
    <ellipse cx="20" cy="55" rx="18" ry="14" fill="#43A047" opacity="0.2" />
    <!-- cloud -->
    <path
      d="M22 28 Q22 20 30 20 Q34 14 42 18 Q48 16 50 22 Q56 22 56 28 Q56 34 50 34 L26 34 Q20 34 22 28Z"
      fill="#90A4AE"
      opacity="0.75"
    />
    <!-- rain drops -->
    <line
      x1="28"
      y1="36"
      x2="26"
      y2="42"
      stroke="#42A5F5"
      stroke-width="1.5"
      stroke-linecap="round"
    />
    <line
      x1="36"
      y1="37"
      x2="34"
      y2="43"
      stroke="#42A5F5"
      stroke-width="1.5"
      stroke-linecap="round"
    />
    <line
      x1="44"
      y1="36"
      x2="42"
      y2="42"
      stroke="#42A5F5"
      stroke-width="1.5"
      stroke-linecap="round"
    />
    <!-- sun peeking -->
    <circle cx="62" cy="18" r="8" fill="#FFB74D" opacity="0.7" />
    <g stroke="#FFB74D" stroke-width="1.2" stroke-linecap="round" opacity="0.5">
      <line x1="62" y1="7" x2="62" y2="9" />
      <line x1="71" y1="18" x2="73" y2="18" />
      <line x1="69" y1="11" x2="70.5" y2="9.5" />
    </g>
    <!-- temperature label -->
    <text x="60" y="62" font-size="11" fill="#E53935" font-family="sans-serif" font-weight="700">
      18°
    </text>
  </svg>

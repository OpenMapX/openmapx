  <path d="M0 76Q22 70 40 60T80 30" fill="none" stroke="#d84315" stroke-width="2.4" stroke-linecap="round" />
  <path d="M76 78Q56 70 40 60T10 18" fill="none" stroke="#0288d1" stroke-width="2.2" stroke-linecap="round" />

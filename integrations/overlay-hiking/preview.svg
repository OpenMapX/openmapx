    <path d="M0 40q18 8 34 0t46 2" />
    <path d="M0 58q18 8 34 2t46 0" />
  </g>
  <!-- two waymarked routes meeting at a junction -->
  <g fill="none" stroke="#fff" stroke-width="4.8" stroke-linecap="round">
    <path d="M0 76Q22 70 40 60T80 30" />
    <path d="M76 78Q56 70 40 60T10 18" />

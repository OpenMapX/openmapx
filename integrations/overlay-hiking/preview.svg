  <path d="M39 60V26" stroke="#7a6544" stroke-width="2.4" stroke-linecap="round" />
  <g stroke="#fff" stroke-width="1.1" stroke-linejoin="round">
    <path d="M39 26h16l5.5 4-5.5 4H39Z" fill="#f6c945" />
    <path d="M39 37h-17l-5.5 4 5.5 4h17Z" fill="#f6c945" />
  </g>
  <g fill="#7a6544" opacity="0.85">

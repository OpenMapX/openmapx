    <line x1="0" y1="40" x2="80" y2="40" stroke="#c0d4db" stroke-width="4" />
    <line x1="40" y1="0" x2="40" y2="80" stroke="#c0d4db" stroke-width="4" />
    <line x1="0" y1="22" x2="80" y2="22" stroke="#c0d4db" stroke-width="2" />
    <line x1="0" y1="60" x2="80" y2="60" stroke="#c0d4db" stroke-width="2" />

<svg
    viewBox="0 0 80 80"
    xmlns="http://www.w3.org/2000/svg"
    width="100%"
    height="100%"
  >
    <defs>
      <linearGradient id="aqi-heatmap" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#009966" stop-opacity="0.45" />
        <stop offset="35%" stop-color="#ffde33" stop-opacity="0.45" />
        <stop offset="65%" stop-color="#ff9933" stop-opacity="0.5" />
        <stop offset="100%" stop-color="#cc0033" stop-opacity="0.45" />
      </linearGradient>
    </defs>
    <rect width="80" height="80" fill="#e4eef2" />
    <!-- subtle roads -->
    <line x1="0" y1="36" x2="80" y2="36" stroke="#d5dce6" stroke-width="3" />
    <line x1="54" y1="0" x2="54" y2="80" stroke="#d5dce6" stroke-width="2" />
    <line x1="22" y1="0" x2="22" y2="80" stroke="#d5dce6" stroke-width="2" />
    <!-- AQI heatmap overlay -->
    <rect x="0" y="0" width="80" height="80" fill="url(#aqi-heatmap)" />
    <!-- station dots with AQI values -->
    <circle cx="16" cy="22" r="7" fill="#009966" opacity="0.8" />
    <text
      x="16"
      y="24.5"
      font-size="7"
      fill="#fff"
      font-family="sans-serif"
      font-weight="700"
      text-anchor="middle"
    >
      32
    </text>
    <circle cx="44" cy="40" r="7" fill="#ffde33" opacity="0.9" />
    <text
      x="44"
      y="42.5"
      font-size="7"
      fill="#666"
      font-family="sans-serif"
      font-weight="700"
      text-anchor="middle"
    >
      78
    </text>
    <circle cx="66" cy="58" r="7" fill="#ff9933" opacity="0.85" />
    <text
      x="66"
      y="60.5"
      font-size="7"
      fill="#fff"
      font-family="sans-serif"
      font-weight="700"
      text-anchor="middle"
    >
      124
    </text>
    <circle cx="30" cy="64" r="5.5" fill="#009966" opacity="0.75" />
    <text
      x="30"
      y="66.2"
      font-size="5.5"
      fill="#fff"
      font-family="sans-serif"
      font-weight="700"
      text-anchor="middle"
    >
      41
    </text>
  </svg>

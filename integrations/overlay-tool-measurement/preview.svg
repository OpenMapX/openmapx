<svg
    viewBox="0 0 80 80"
    xmlns="http://www.w3.org/2000/svg"
    width="100%"
    height="100%"
  >
    <rect width="80" height="80" fill="#bee0ef" />
    <!-- land -->
    <path d="M0 22 Q22 18 44 24 Q66 30 80 22 L80 80 L0 80Z" fill="#c7e9d8" opacity="0.5" />
    <!-- measurement line -->
    <line x1="16" y1="60" x2="64" y2="22" stroke="#111827" stroke-width="2" stroke-linecap="round" />
    <!-- endpoints -->
    <circle cx="16" cy="60" r="4" fill="#fff" stroke="#111827" stroke-width="2" />
    <circle cx="64" cy="22" r="4" fill="#fff" stroke="#111827" stroke-width="2" />
    <!-- ruler ticks -->
    <line x1="23" y1="54" x2="25.5" y2="56" stroke="#111827" stroke-width="1.2" />
    <line x1="30" y1="48" x2="32.5" y2="50" stroke="#111827" stroke-width="1.2" />
    <line x1="40" y1="40" x2="42.5" y2="42" stroke="#111827" stroke-width="1.5" />
    <line x1="48" y1="34" x2="50.5" y2="36" stroke="#111827" stroke-width="1.2" />
    <line x1="55" y1="28" x2="57.5" y2="30" stroke="#111827" stroke-width="1.2" />
    <!-- distance label -->
    <rect x="29" y="34" width="22" height="10" rx="2" fill="#fff" opacity="0.9" />
    <text
      x="40"
      y="41.5"
      font-size="7"
      fill="#111827"
      text-anchor="middle"
      font-family="sans-serif"
      font-weight="600"
    >
      2.4 km
    </text>
  </svg>

plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
group = 'org.openmapx.androidauto'
version = '1.0.0'
android {
  namespace "org.openmapx.androidauto"
  defaultConfig {
    versionCode 1; versionName "1.0.0"
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
  }
  sourceSets { androidTest.assets.srcDir rootProject.file("../../../apps/web/node_modules/maplibre-gl/dist") }
  testOptions { unitTests.includeAndroidResources = true }
}
dependencies {
  implementation 'com.facebook.react:react-android'
  implementation 'androidx.car.app:app:1.7.0'
  implementation 'androidx.car.app:app-projected:1.7.0'
  implementation 'androidx.webkit:webkit:1.14.0'
  // Android Auto's turn notification extends the trip's existing navigation card.
  implementation project(':openmapx-navigation-surfaces')
  androidTestImplementation 'androidx.test:runner:1.7.0'
  androidTestImplementation 'androidx.test.ext:junit:1.3.0'
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.robolectric:robolectric:4.16.1'
  testImplementation 'androidx.car.app:app-testing:1.7.0'
}

plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'org.openmapx.navigationaudio'
version = '1.0.0'

android {
  namespace "expo.modules.openmapxnavigationaudio"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  testOptions {
    unitTests {
      // The policy classes under test are plain Kotlin; failing on a stray
      // android.* call is better than silently returning a zeroed stub.
      returnDefaultValues = false
    }
  }
}

dependencies {
  // Host-side tests for the framework-free decision logic. These sources are
  // committed with the module; only the Gradle project that runs them is
  // regenerated by CNG.
  testImplementation 'junit:junit:4.13.2'
}

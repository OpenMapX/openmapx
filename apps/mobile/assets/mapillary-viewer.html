<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="https://unpkg.com/mapillary-js@4.1.2/dist/mapillary.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #viewer { width: 100%; height: 100%; background: #000; overflow: hidden; }
  </style>
</head>
<body>
  <div id="viewer"></div>
  <script src="https://unpkg.com/mapillary-js@4.1.2/dist/mapillary.min.js"></script>
  <script>
    // Parse token and initial image ID from URL hash
    // Format: #token=MLY|...|...&imageId=123456
    var params = {};
    if (window.location.hash) {
      window.location.hash.substring(1).split('&').forEach((pair) => {
        var kv = pair.split('=');
        if (kv.length === 2) params[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1]);
      });
    }

    var accessToken = params.token || '';
    var initialImageId = params.imageId || '';

    var viewer = new mapillary.Viewer({
      accessToken: accessToken,
      container: 'viewer',
      component: { cover: false },
    });

    if (initialImageId) {
      viewer.moveTo(initialImageId).catch(() => {});
    }

    // Listen for messages from React Native
    var handleMessage = (event) => {
      try {
        const data = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
        if (data.type === 'navigate' && data.imageId) {
          viewer.moveTo(data.imageId).catch(() => {});
        }
      } catch (_e) {}
    };

    // Android sends via document, iOS via window
    window.addEventListener('message', handleMessage);
    document.addEventListener('message', handleMessage);

    // Send position updates back to React Native
    viewer.on('position', (event) => {
      if (window.ReactNativeWebView) {
        window.ReactNativeWebView.postMessage(JSON.stringify({
          type: 'position',
          lat: event.latLon.lat,
          lng: event.latLon.lng,
        }));
      }
    });

    // Send image change events back to React Native
    viewer.on('image', (event) => {
      if (window.ReactNativeWebView) {
        window.ReactNativeWebView.postMessage(JSON.stringify({
          type: 'image',
          imageId: event.image.id,
          lat: event.image.lngLat.lat,
          lng: event.image.lngLat.lng,
          capturedAt: event.image.capturedAt,
        }));
      }
    });
  </script>
</body>
</html>

packages:
  - "apps/*"
  - "packages/*"
  - "integrations/*"
  - "services/data-manager"

# Hoist packages that integration frontend files import from the web app.
# Without this, Turbopack can't resolve them when bundling files in integrations/*/.
publicHoistPattern:
  - "@mui/*"
  - "maplibre-gl"
  - "next-intl"
  - "@turf/*"
  - "@tanstack/react-query"

# Supply-chain hardening. Keep these explicit so pnpm upgrades or local
# defaults cannot silently relax install-time protections.
strictDepBuilds: true
dangerouslyAllowAllBuilds: false
allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  cpu-features: false
  esbuild: true
  protobufjs: false
  sharp: true
  ssh2: false
blockExoticSubdeps: true
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
trustPolicy: no-downgrade

# TypeScript 7 has no compiler API yet; keep this workspace's direct compiler
# dependencies on TypeScript 6 while allowing other dependencies to move.
updateConfig:
  ignoreDependencies:
    - typescript

overrides:
  "@hey-api/client-fetch": "workspace:*"
  "protobufjs": ">=7.5.5"
  "uuid": ">=14.0.0"
  # Next's optional sharp dependency currently resolves to vulnerable 0.34.x.
  # The workspace requires Node >=24, which is compatible with sharp 0.35+.
  "sharp": ">=0.35.0"
  "esbuild": ">=0.28.1"
  "postcss": ">=8.5.10"
  # Keep ajv's fast-uri dependency off the vulnerable 4.1.1 release.
  "fast-uri": ">=4.1.2"
  # js-yaml 5.2.x is a dual CJS/ESM package that addresses the merge-key DoS
  # (GHSA-h67p-54hq-rp68) structurally: load() defaults to CORE_SCHEMA (no
  # `!!merge`), plus the maxTotalMergeKeys/maxAliases caps added in 5.2.0.
  # Pinned to keep one version workspace-wide — our compose-renderer and the
  # @changesets/cli transitive both resolve to 5.2.x.
  "js-yaml": "^5.2.1"
  # read-yaml-file@2.1.0 is a @changesets/cli transitive that does a CJS
  # `require("js-yaml").load(...)`. It works with js-yaml 5's `require` entry
  # (5.x is a dual package) and its `load`. 3.0.0 is ESM-only and breaks the
  # CJS changesets requires, so stay on 2.1.0.
  "read-yaml-file": "^2.1.0"
  # react-redux@9.2.0 and reselect@5.1.1 ship without provenance attestation
  # even though earlier and later versions have it; pin to the latest provenance-
  # signed releases so pnpm's `trustPolicy: no-downgrade` lets the install
  # complete. recharts@3.8.1 (the only consumer in apps/web) accepts both ranges.
  "react-redux": "9.3.0"
  "reselect": "5.2.0"
  # pure-web-bottom-sheet ships separate React, Vue and vanilla entries but declares
  # `vue` and `@vue/language-core` as unconditional peers (no
  # peerDependenciesMeta.optional), and @vue/language-core is a dev-time language
  # server that has no business being a peer at all — an upstream packaging bug.
  # We import only the React entry, so auto-install drags in a Vue toolchain we
  # never load, and @vue/language-core@3.0.11 lost the trusted-publisher evidence
  # its predecessors had, which `trustPolicy: no-downgrade` rightly refuses.
  # 3.0.10 is trusted and satisfies the ~3.0.10 peer range.
  #
  # The alternatives were worse: `autoInstallPeers: false` fixes it repo-wide but
  # rewrote 220 lockfile lines and dropped @testing-library/dom, breaking the test
  # toolchain; `peerDependencyRules.ignoreMissing` does not stop the auto-install.
  # Nothing imports these packages and none of them are on the `allowBuilds`
  # allowlist, so no install scripts run. Drop this pin if the peer ever becomes
  # optional upstream.
  "@vue/language-core": "3.0.10"
  # tinyexec switched from trusted-publisher to provenance-attestation at 1.2.x,
  # which `trustPolicy: no-downgrade` flags as a downgrade. 1.1.2 (trusted-
  # publisher) satisfies commitlint's `^1.0.0` range, so pin to it until
  # tinyexec regains trusted-publisher evidence on a newer release.
  "tinyexec": "1.1.2"
  # tsup@8.5.1 requests chokidar@^4.0.3, but 4.0.3 has no npm provenance
  # attestation. Keep this tsup-only edge on the last attested 4.x release.
  "tsup>chokidar": "4.0.1"

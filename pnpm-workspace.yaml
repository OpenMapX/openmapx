packages:
  - "apps/*"
  - "packages/*"
  - "integrations/*"
  - "services/data-manager"

# Hoist packages that integration frontend files import from the web app.
# Without this, Turbopack can't resolve them when bundling files in integrations/*/.
publicHoistPattern:
  - "@mui/*"
  - "maplibre-gl"
  - "next-intl"
  - "@turf/*"
  - "@tanstack/react-query"

# Supply-chain hardening. Keep these explicit so pnpm upgrades or local
# defaults cannot silently relax install-time protections.
strictDepBuilds: true
dangerouslyAllowAllBuilds: false
allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  cpu-features: false
  esbuild: true
  protobufjs: false
  sharp: true
  ssh2: false
  # Dev-time only (an expo-doctor transitive). Its postinstall merely relinks the
  # prebuilt platform binding that pnpm already installs as an optional
  # dependency, so nothing needs to run at install time.
  unrs-resolver: false
blockExoticSubdeps: true
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
# Install this exact security patch immediately; retain the age gate elsewhere.
minimumReleaseAgeExclude:
  - "node-forge@1.4.2"
trustPolicy: no-downgrade

# TypeScript 7 has no compiler API yet; keep this workspace's direct compiler
# dependencies on TypeScript 6 while allowing other dependencies to move.
updateConfig:
  ignoreDependencies:
    - typescript

overrides:
  "@hey-api/client-fetch": "workspace:*"
  "node-forge@1": "^1.4.2" # CVE-2026-85393; includes the PEM Buffer regression fix.
  "protobufjs": ">=7.5.5"
  "uuid": ">=14.0.0"
  # Include sharp 0.35.5's librsvg fix (GHSA-wq5f-xc86-pv6w) as well as
  # the libheif fixes from 0.35.4.
  # The workspace requires Node >=24, which is compatible with sharp 0.35+.
  "sharp": ">=0.35.5"
  # Transitive dependencies also ship in the production workspace installs.
  # Keep consumers on their compatible major lines with the patched releases.
  "compression@1": "^1.8.2" # CVE-2026-87776
  "shell-quote@1": "^1.11.0" # CVE-2026-102422
  "source-map-js@1": "^1.2.2" # CVE-2026-93749
  # Updating vue brings its exact-version renderer/compiler dependencies along.
  "vue@3": "^3.5.42" # GHSA-g2v6-rqmx-r4w6
  # Serwist pins zod 4.6.5, and zod 3 has no patched release. The Expo CLI,
  # the only zod 3 consumer, uses schema APIs that zod 4 keeps.
  "zod": "^4.6.7" # GHSA-mrhx-c7xc-m3w5
  "@xmldom/xmldom@0.9": "^0.9.12"
  "esbuild": ">=0.28.1"
  "postcss": ">=8.5.10"
  # Force every 7.x consumer onto the security-fixed request stack. Scalar's
  # parser and the AI SDK still declare older compatible 7.x ranges; this
  # override resolves them to 8.x, so it also excludes the 8.x releases before
  # the same fix.
  "undici@7": ">=7.30.1 <8.0.0 || >=8.12.3" # GHSA-xjj6-f33q-929c
  # jsdom and testcontainers lock the 8.x release before the fix.
  "undici@8": "^8.12.3" # GHSA-xjj6-f33q-929c
  # Serwist pins 4.28.6 directly; 4.28.7+ fixes its unbounded query cache and
  # custom-stats prototype write. Keep the workspace on the current 4.x line.
  "browserslist": ">=4.29.0"
  # minimatch 3.x and 10.x still accept brace-expansion releases with the
  # expansion DoS (CVE-2026-102276, CVE-2026-102278).
  "brace-expansion@1": "^1.1.21"
  "brace-expansion@5": "^5.0.12"
  # Keep ajv's fast-uri dependency off the vulnerable 4.1.1 release.
  "fast-uri": ">=4.1.2"
  # js-yaml 5.2.x is a dual CJS/ESM package that addresses the merge-key DoS
  # (GHSA-h67p-54hq-rp68) structurally: load() defaults to CORE_SCHEMA (no
  # `!!merge`), plus the maxTotalMergeKeys/maxAliases caps added in 5.2.0.
  # Default for YAML consumers; Orval's ESM entry still requires the v4 default export.
  "js-yaml": "^5.2.1"
  # Orval pins this maintained v4 release, including the merge/omap DoS fixes.
  # Keep this exception scoped to dev-only code generation, not runtime parsers.
  "orval@8.43.0>js-yaml": "4.3.2"
  # react-redux@9.2.0 and reselect@5.1.1 ship without provenance attestation
  # even though earlier and later versions have it; pin to the latest provenance-
  # signed releases so pnpm's `trustPolicy: no-downgrade` lets the install
  # complete. recharts@3.8.1 (the only consumer in apps/web) accepts both ranges.
  "react-redux": "9.3.0"
  "reselect": "5.2.0"
  # pure-web-bottom-sheet ships separate React, Vue and vanilla entries but declares
  # `vue` and `@vue/language-core` as unconditional peers (no
  # peerDependenciesMeta.optional), and @vue/language-core is a dev-time language
  # server that has no business being a peer at all — an upstream packaging bug.
  # We import only the React entry, so auto-install drags in a Vue toolchain we
  # never load, and @vue/language-core@3.0.11 lost the trusted-publisher evidence
  # its predecessors had, which `trustPolicy: no-downgrade` rightly refuses.
  # 3.0.10 is trusted and satisfies the ~3.0.10 peer range.
  #
  # The alternatives were worse: `autoInstallPeers: false` fixes it repo-wide but
  # rewrote 220 lockfile lines and dropped @testing-library/dom, breaking the test
  # toolchain; `peerDependencyRules.ignoreMissing` does not stop the auto-install.
  # Nothing imports these packages and none of them are on the `allowBuilds`
  # allowlist, so no install scripts run. Drop this pin if the peer ever becomes
  # optional upstream.
  "@vue/language-core": "3.0.10"
  # tinyexec switched from trusted-publisher to provenance-attestation at 1.2.x,
  # which `trustPolicy: no-downgrade` flags as a downgrade. 1.1.2 (trusted-
  # publisher) satisfies commitlint's `^1.0.0` range, so pin to it until
  # tinyexec regains trusted-publisher evidence on a newer release.
  "tinyexec": "1.1.2"
  # tsup@8.5.1 requests chokidar@^4.0.3, but 4.0.3 has no npm provenance
  # attestation. Keep this tsup-only edge on the last attested 4.x release.
  "tsup>chokidar": "4.0.1"
  # Babel's runtime/target plugins still request the semver 6 line, whose last
  # release (6.3.1) predates provenance attestation, so `trustPolicy:
  # no-downgrade` refuses it. semver 7 is API-compatible for the `satisfies`,
  # `valid` and `intersects` calls these plugins make, and every other package
  # in this workspace already resolves to 7.x.
  "semver@6": "^7.8.5"
  # jest-expo 57 is tested against Jest 29, but this workspace runs the latest
  # Jest. @react-native/jest-preset still pins jest-environment-node 29, and
  # mixing them gives every mobile suite
  # "this._moduleMocker.clearMocksOnScope is not a function", because Jest 30's
  # runtime drives a Jest 29 module mocker. The preset only subclasses the
  # environment's exported `TestEnvironment`, which is unchanged in 30.
  "@react-native/jest-preset>jest-environment-node": "^30.4.1"
  # jest-expo 57 still pins jest-watch-typeahead 2 even though this workspace
  # runs Jest 30. The plugin's 3.x line is the Jest 30-compatible successor.
  "jest-expo>jest-watch-typeahead": "^3.0.1"
  # Expo 57.0.26's expo-asset range accepts constants 57.0.20, but the frozen
  # graph otherwise retains 57.0.19 beside the app's 57.0.20 native module.
  # Keep a single compatible native runtime while the newer Expo wave remains
  # ineligible under the no-downgrade trust policy.
  "expo-asset>expo-constants": "57.0.20"
  # Expo SDK 57 is coupled to React Native 0.86.3. Without this workspace-wide
  # constraint, drizzle-orm's optional expo-sqlite peer in server workspaces
  # auto-installs the newer 0.87.x line and leaves duplicate native modules.
  "react-native": "0.86.3"
  # pnpm attaches a package's optional peer whenever any workspace project
  # installs it. These peers serve entry points nothing here imports, and the
  # API's production install carried them: Expo, React Native and Hermes
  # through drizzle-orm's `drizzle-orm/expo-sqlite` (only apps/mobile installs
  # expo-sqlite, and it does not use drizzle-orm) and @better-auth/expo's
  # `/client`; Next.js, Vue and Vitest through better-auth's `/next-js`, `/vue`
  # and `/test`. Remove an entry before importing the entry point it serves.
  "@better-auth/expo>expo-constants": "-"
  "@better-auth/expo>expo-linking": "-"
  "@better-auth/expo>expo-network": "-"
  "@better-auth/expo>expo-secure-store": "-"
  "@better-auth/expo>expo-web-browser": "-"
  "better-auth>drizzle-kit": "-"
  "better-auth>next": "-"
  "better-auth>vitest": "-"
  "better-auth>vue": "-"
  "drizzle-orm>expo-sqlite": "-"

peerDependencyRules:
  # @emoji-mart/react is unchanged since 2022 and its React peer range stops at
  # 18, but its hook-based adapter remains compatible with this workspace's
  # React 19 and is covered by the web build/tests.
  allowedVersions:
    react: "^19"

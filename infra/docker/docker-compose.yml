services:
  postgis:
    image: postgis/postgis:17-3.5
    ports: ["5432:5432"]
    environment:
      POSTGRES_DB: openmapx
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes: ["pgdata:/var/lib/postgresql/data"]

  martin:
    image: ghcr.io/maplibre/martin:latest
    ports: ["3001:3000"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgis:5432/openmapx
    depends_on: [postgis]

  tileserver:
    image: maptiler/tileserver-gl:latest
    ports: ["8080:8080"]
    volumes: ["./tiles:/data"]

  pelias-api:
    image: pelias/api:latest
    ports: ["4000:4000"]

  valhalla:
    image: ghcr.io/gis-ops/valhalla:latest
    ports: ["8002:8002"]
    volumes: ["./valhalla:/custom_files"]

volumes:
  pgdata:


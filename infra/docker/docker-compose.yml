# ── OpenMapX Docker Compose ───────────────────────────────────────────────
#
# Data management:
#   All services share source data (OSM PBF, GTFS feeds) via hardlinks.
#   Use ./manage.sh to download, link, and build service data.
#
# Profiles:
#   (none)    Core: postgis, redis
#   proxy     Traefik reverse proxy (TLS termination, path-based routing)
#   app       API + Web (Fastify + Next.js, built from repo)
#   routing   Valhalla + OSRM (Valhalla handles planet, OSRM region-only)
#   transit   MOTIS + OTP (MOTIS handles planet, OTP region-only)
#   pelias    Elasticsearch + Pelias (self-hosted geocoding)
#   nominatim Nominatim (self-hosted geocoding, alternative to Pelias)
#   photon    Photon (lightweight self-hosted geocoder)
#   overpass  Overpass API (self-hosted OSM query service)
#   tiles     TileServer GL (self-hosted map tiles + styles)
#   martin    Martin vector tile server (from PostGIS)
#   build     One-shot build containers (OSRM, OTP, Pelias importers)
#
# Local development:
#   docker compose up -d                              # core only
#   docker compose --profile routing up -d             # + routing
#   docker compose --profile transit up -d             # + transit
#
# Production deployment:
#   cp .env.example .env && vim .env                   # configure domain, keys
#   ./manage.sh download-osm planet                    # ~70 GB
#   ./manage.sh download-all-feeds                     # ~500+ GTFS feeds
#   ./manage.sh download-style                         # map style, fonts, sprites
#   ./manage.sh link && ./manage.sh build-all          # build service data
#   docker compose --profile proxy --profile app \
#     --profile routing --profile transit \
#     --profile nominatim --profile photon \
#     --profile overpass --profile tiles up -d
#
# Planet-scale notes:
#   OSRM is skipped (needs ~200 GB RAM) — Valhalla covers routing.
#   OTP is skipped (can't handle planet + all feeds) — MOTIS covers transit.
#   Nominatim planet import needs ~64 GB RAM (peak), ~2 GB runtime.
#   Recommended server: 64+ GB RAM, 1+ TB SSD for full planet setup.
# ─────────────────────────────────────────────────────────────────────────

services:

  # ── Reverse Proxy ───────────────────────────────────────────────────────

  traefik:
    image: traefik:v3.4
    profiles: [proxy]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - traefik-acme:/etc/traefik
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    networks: [openmapx]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m

  # ── Application ─────────────────────────────────────────────────────────

  api:
    image: ghcr.io/medformatik/openmapx-api:latest
    profiles: [app]
    env_file: ../../apps/api/.env
    environment:
      PORT: "3001"
      HOST: "0.0.0.0"
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgis:5432/openmapx
      REDIS_URL: redis://redis:6379
      OSRM_URL: http://osrm:5000
      VALHALLA_URL: http://valhalla:8002
      OTP_URL: http://otp:8080
      MOTIS_URL: http://motis:8080
      PELIAS_URL: http://pelias-api:4000
      NOMINATIM_URL: http://nominatim:8080
      PHOTON_URL: http://photon:2322
      OVERPASS_URL: http://overpass:80
      CORS_ORIGIN: https://${DOMAIN:-localhost},http://localhost:3000
      BETTER_AUTH_URL: https://${DOMAIN:-localhost}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      PASSKEY_RP_ID: ${DOMAIN:-localhost}
      PASSKEY_ORIGIN: https://${DOMAIN:-localhost}
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      traefik.enable: "true"
      traefik.http.routers.api.rule: Host(`${DOMAIN:-localhost}`) && PathPrefix(`/api`)
      traefik.http.routers.api.entrypoints: websecure
      traefik.http.routers.api.tls.certresolver: letsencrypt
      traefik.http.services.api.loadbalancer.server.port: "3001"
      # Health endpoint doesn't have /api prefix
      traefik.http.routers.api-health.rule: Host(`${DOMAIN:-localhost}`) && Path(`/health`)
      traefik.http.routers.api-health.entrypoints: websecure
      traefik.http.routers.api-health.tls.certresolver: letsencrypt
      traefik.http.routers.api-health.service: api
    networks: [openmapx]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g

  web:
    image: ghcr.io/medformatik/openmapx-web:latest
    profiles: [app]
    labels:
      traefik.enable: "true"
      traefik.http.routers.web.rule: Host(`${DOMAIN:-localhost}`)
      traefik.http.routers.web.entrypoints: websecure
      traefik.http.routers.web.tls.certresolver: letsencrypt
      traefik.http.routers.web.priority: "1"
      traefik.http.services.web.loadbalancer.server.port: "3000"
    networks: [openmapx]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m

  # ── Core Infrastructure ────────────────────────────────────────────────

  postgis:
    image: postgis/postgis:17-3.5
    ports: ["127.0.0.1:5432:5432"]
    environment:
      POSTGRES_DB: openmapx
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    networks: [openmapx]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2g
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redisdata:/data"]
    networks: [openmapx]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
    restart: unless-stopped

  # ── Routing ─────────────────────────────────────────────────────────────
  # Valhalla: primary router, handles planet-scale (~16 GB RAM for planet)
  # OSRM: region-only alternative (~4 GB RAM for single country)

  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:latest
    ports: ["127.0.0.1:8002:8002"]
    volumes:
      - ./data/valhalla:/custom_files
      - ./services/valhalla/valhalla.json:/custom_files/valhalla.json
    environment:
      serve_tiles: "True"
      build_elevation: "True"
      build_admins: "True"
      build_time_zones: "True"
      use_tiles_ignore_pbf: "False"
    profiles: [routing]
    networks: [openmapx]
    deploy:
      resources:
        limits:
          memory: 16g
    restart: unless-stopped

  osrm:
    image: ghcr.io/project-osrm/osrm-backend:latest
    ports: ["127.0.0.1:5000:5000"]
    volumes: ["./data/osrm:/data:ro"]
    command: osrm-routed --algorithm mld /data/region.osrm
    profiles: [routing]
    networks: [openmapx]
    deploy:
      resources:
        limits:
          memory: 8g
    restart: unless-stopped

  # ── Transit ─────────────────────────────────────────────────────────────
  # MOTIS: primary transit router, handles planet-scale + hundreds of feeds
  # OTP: region-only alternative (max ~10 GTFS feeds)

  motis:
    image: ghcr.io/motis-project/motis:latest
    ports: ["127.0.0.1:8081:8080"]
    volumes:
      - ./data/motis:/data
    profiles: [transit]
    networks: [openmapx]
    deploy:
      resources:
        limits:
          memory: 16g
    restart: unless-stopped

  otp:
    image: opentripplanner/opentripplanner:latest
    ports: ["127.0.0.1:8090:8080"]
    volumes:
      - ./data/otp:/var/opentripplanner
      - ./services/otp/build-config.json:/var/opentripplanner/build-config.json:ro
      - ./services/otp/router-config.json:/var/opentripplanner/router-config.json:ro
    command: --load --serve
    profiles: [transit]
    networks: [openmapx]
    deploy:
      resources:
        limits:
          memory: 8g
    restart: unless-stopped

  # ── Geocoding (Pelias) ─────────────────────────────────────────────────

  elasticsearch:
    image: elasticsearch:7.17.18
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
      # Security disabled: single-node geocoding-only instance, bound to 127.0.0.1.
      # Acceptable risk for internal Pelias indexing. Do NOT expose on public network.
      - xpack.security.enabled=false
    ports: ["127.0.0.1:9200:9200"]
    volumes: ["esdata:/usr/share/elasticsearch/data"]
    profiles: [pelias, build]
    networks: [openmapx]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 4g
    restart: unless-stopped

  pelias-api:
    image: pelias/api:latest
    ports: ["127.0.0.1:4000:4000"]
    volumes: ["./services/pelias/pelias.json:/code/pelias.json:ro"]
    environment:
      PELIAS_CONFIG: /code/pelias.json
    depends_on:
      elasticsearch:
        condition: service_healthy
    profiles: [pelias]
    networks: [openmapx]
    restart: unless-stopped

  pelias-placeholder:
    image: pelias/placeholder:latest
    ports: ["127.0.0.1:4100:4100"]
    volumes:
      - ./services/pelias/pelias.json:/code/pelias.json:ro
      - ./data/pelias/placeholder:/data/placeholder
    environment:
      PELIAS_CONFIG: /code/pelias.json
    profiles: [pelias]
    networks: [openmapx]
    restart: unless-stopped

  pelias-pip:
    image: pelias/pip-service:latest
    ports: ["127.0.0.1:4200:4200"]
    volumes:
      - ./services/pelias/pelias.json:/code/pelias.json:ro
      - ./data/pelias/whosonfirst:/data/whosonfirst:ro
    environment:
      PELIAS_CONFIG: /code/pelias.json
    profiles: [pelias]
    networks: [openmapx]
    restart: unless-stopped

  # ── Geocoding (Nominatim) ──────────────────────────────────────────────
  # Full-featured geocoder. Bundles its own PostgreSQL internally.
  # Planet import: ~64 GB RAM peak, ~1.5 TB disk, ~48h on fast hardware.
  # After import: ~2 GB RAM runtime, ~1 TB disk.
  # Shares OSM PBF via data/nominatim/ (hardlinked from data/osm/).

  nominatim:
    image: mediagis/nominatim:5.2
    ports: ["127.0.0.1:8088:8080"]
    volumes:
      - nominatim-data:/var/lib/postgresql/16/main
      - nominatim-flatnode:/nominatim/flatnode
      - ./data/nominatim:/nominatim/data
    environment:
      PBF_PATH: /nominatim/data/data.osm.pbf
      REPLICATION_URL: https://planet.openstreetmap.org/replication/day
      REPLICATION_UPDATE_INTERVAL: "86400"
      NOMINATIM_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      THREADS: ${NOMINATIM_THREADS:-8}
      IMPORT_STYLE: full
      REVERSE_ONLY: "false"
      IMPORT_WIKIPEDIA: "${NOMINATIM_IMPORT_WIKIPEDIA:-true}"
      IMPORT_US_POSTCODES: "${NOMINATIM_IMPORT_US_POSTCODES:-false}"
      IMPORT_GB_POSTCODES: "${NOMINATIM_IMPORT_GB_POSTCODES:-false}"
    profiles: [nominatim]
    networks: [openmapx]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s
    shm_size: 1g
    deploy:
      resources:
        limits:
          memory: 64g
    restart: unless-stopped

  # ── Geocoding (Photon) ───────────────────────────────────────────────
  # Lightweight geocoder with search-as-you-type support.
  # Auto-downloads pre-built worldwide search index on first start.
  # Planet index: ~8 GB RAM runtime, ~200 GB disk.

  photon:
    image: rtuszik/photon-docker:latest
    ports: ["127.0.0.1:2322:2322"]
    volumes:
      - ./data/photon:/photon/data
    environment:
      REGION: ${PHOTON_REGION:-planet}
      UPDATE_STRATEGY: PARALLEL
      UPDATE_INTERVAL: 720h
      LOG_LEVEL: INFO
    profiles: [photon]
    networks: [openmapx]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:2322/api?q=test || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s
    deploy:
      resources:
        limits:
          memory: 8g
    restart: unless-stopped

  # ── Overpass API ──────────────────────────────────────────────────────
  # Self-hosted OSM query service for transit stops, POIs, trails, etc.
  # Planet import: ~24h, ~200 GB disk, ~4 GB RAM.
  # Uses pre-converted bz2 in data/overpass/osm/ (created by manage.sh link).

  overpass:
    image: wiktorn/overpass-api:latest
    ports: ["127.0.0.1:8082:80"]
    volumes:
      - ./data/overpass/db:/db
      - ./data/overpass/osm:/osm:ro
    environment:
      OVERPASS_META: "yes"
      OVERPASS_MODE: init
      OVERPASS_PLANET_URL: "file:///osm/data.osm.bz2"
      OVERPASS_PLANET_PREPROCESS: "rm -f /db/planet.osm.bz2 && ln -s /osm/data.osm.bz2 /db/planet.osm.bz2"
      OVERPASS_DIFF_URL: https://planet.openstreetmap.org/replication/day/
      OVERPASS_COMPRESSION: lz4
      OVERPASS_RULES_LOAD: "10"
      OVERPASS_SPACE: ${OVERPASS_SPACE:-107374182400}
      OVERPASS_UPDATE_SLEEP: "86400"
      OVERPASS_FASTCGI_PROCESSES: ${OVERPASS_FASTCGI_PROCESSES:-4}
      OVERPASS_STOP_AFTER_INIT: "false"
      OVERPASS_MAX_TIMEOUT: "300s"
    profiles: [overpass]
    networks: [openmapx]
    healthcheck:
      test: ["CMD-SHELL", "curl -qfs 'http://localhost/api/interpreter?data=[out:json];node(1);out;' | grep -q Overpass || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 172800s
    deploy:
      resources:
        limits:
          memory: 32g
    restart: unless-stopped

  # ── Tile Serving ────────────────────────────────────────────────────────

  martin:
    image: ghcr.io/maplibre/martin:latest
    ports: ["127.0.0.1:3002:3000"]
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgis:5432/openmapx
    depends_on:
      postgis:
        condition: service_healthy
    profiles: [martin]
    labels:
      traefik.enable: "true"
      traefik.http.routers.martin.rule: Host(`${DOMAIN:-localhost}`) && PathPrefix(`/martin`)
      traefik.http.routers.martin.entrypoints: websecure
      traefik.http.routers.martin.tls.certresolver: letsencrypt
      traefik.http.middlewares.martin-strip.stripprefix.prefixes: /martin
      traefik.http.routers.martin.middlewares: martin-strip
      traefik.http.services.martin.loadbalancer.server.port: "3000"
    networks: [openmapx]
    restart: unless-stopped

  tileserver:
    image: maptiler/tileserver-gl:latest
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - ./data/tileserver:/data:ro
      - ./services/tileserver/config.json:/data/config.json:ro
    profiles: [tiles]
    labels:
      traefik.enable: "true"
      traefik.http.routers.tiles.rule: Host(`${DOMAIN:-localhost}`) && PathPrefix(`/tiles`)
      traefik.http.routers.tiles.entrypoints: websecure
      traefik.http.routers.tiles.tls.certresolver: letsencrypt
      traefik.http.middlewares.tiles-strip.stripprefix.prefixes: /tiles
      traefik.http.routers.tiles.middlewares: tiles-strip
      traefik.http.services.tiles.loadbalancer.server.port: "8080"
    networks: [openmapx]
    deploy:
      resources:
        limits:
          memory: 2g
    restart: unless-stopped

  # ── Build Services (one-shot, used by manage.sh) ────────────────────────

  # Transitous import tools: fetches GTFS feeds, cleans with gtfsclean,
  # resolves Transitland/MDB references, generates MOTIS config + Lua scripts.
  transitous-import:
    build:
      context: ./services/transitous
      dockerfile: Dockerfile
    volumes:
      - ./data/.transitous-catalog:/transitous
      - ./data/gtfs:/transitous/out
      - ./data/.transitous-downloads:/transitous/downloads
      - ./services/transitous/fetch-and-configure.sh:/run.sh:ro
      - ./services/transitous/apply-api-keys.py:/transitous/apply-api-keys.py:ro
      - ./services/transitous/api-keys.json:/transitous/api-keys.json:ro
    profiles: [build]
    networks: [openmapx]
    entrypoint: ["/bin/bash"]

  osrm-build:
    image: ghcr.io/project-osrm/osrm-backend:latest
    volumes: ["./data/osrm:/data"]
    profiles: [build]
    networks: [openmapx]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        osrm-extract -p /opt/car.lua /data/region.osm.pbf &&
        osrm-partition /data/region.osrm &&
        osrm-customize /data/region.osrm

  otp-build:
    image: opentripplanner/opentripplanner:latest
    volumes:
      - ./data/otp:/var/opentripplanner
      - ./services/otp/build-config.json:/var/opentripplanner/build-config.json:ro
    profiles: [build]
    networks: [openmapx]
    command: --build --save
    deploy:
      resources:
        limits:
          memory: 8g

  pelias-schema:
    image: pelias/schema:latest
    volumes: ["./services/pelias/pelias.json:/code/pelias.json:ro"]
    environment:
      PELIAS_CONFIG: /code/pelias.json
    depends_on:
      elasticsearch:
        condition: service_healthy
    profiles: [build]
    networks: [openmapx]

  pelias-whosonfirst-import:
    image: pelias/whosonfirst:latest
    volumes:
      - ./services/pelias/pelias.json:/code/pelias.json:ro
      - ./data/pelias/whosonfirst:/data/whosonfirst
    environment:
      PELIAS_CONFIG: /code/pelias.json
    depends_on:
      elasticsearch:
        condition: service_healthy
    profiles: [build]
    networks: [openmapx]

  pelias-openstreetmap-import:
    image: pelias/openstreetmap:latest
    volumes:
      - ./services/pelias/pelias.json:/code/pelias.json:ro
      - ./data/pelias/openstreetmap:/data/openstreetmap
    environment:
      PELIAS_CONFIG: /code/pelias.json
    depends_on:
      elasticsearch:
        condition: service_healthy
    profiles: [build]
    networks: [openmapx]

  pelias-placeholder-build:
    image: pelias/placeholder:latest
    volumes:
      - ./services/pelias/pelias.json:/code/pelias.json:ro
      - ./data/pelias/placeholder:/data/placeholder
    environment:
      PELIAS_CONFIG: /code/pelias.json
    profiles: [build]
    networks: [openmapx]
    command: npm run build

volumes:
  pgdata:
  esdata:
  redisdata:
  traefik-acme:
  nominatim-data:
  nominatim-flatnode:

networks:
  openmapx:
    driver: bridge

# OpenMapX Data Configuration
# Used by manage.sh to download and manage data for self-hosted services.

# ── OSM Region ───────────────────────────────────────────────────────────
# Geofabrik region path — see https://download.geofabrik.de/
#
# "planet"            Full planet (~70 GB PBF, ~80 GB tiles)
#                     Requires: ~64 GB RAM (Nominatim import), ~30 GB (tile gen)
#                     OSRM and OTP are automatically disabled (use Valhalla/MOTIS)
#
# "europe/germany"    Single country (~3.8 GB)
# "europe"            Continent (~28 GB)
# "north-america"     Continent (~13 GB)
REGION=planet

# ── GTFS Countries ───────────────────────────────────────────────────────
# 2-letter country codes for GTFS feed downloads (comma-separated).
# Leave empty or unset to download all worldwide feeds (~1800+).
#
# "de"            Germany only
# "de,at,ch"      DACH region
# ""              All countries (planet)
# GTFS_COUNTRIES=de

# ── Download Concurrency ─────────────────────────────────────────────────
# Number of parallel GTFS feed downloads (for download-all-feeds)
MAX_CONCURRENT_DOWNLOADS=5

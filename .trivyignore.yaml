vulnerabilities:
  # Docker 29.7.2 is the newest official static CLI release as of 2026-08-20,
  # but it was built with Go 1.26.5, one patch before these stdlib fixes.
  # Keep each exception scoped to that binary and let it expire so a newer
  # upstream build must replace it rather than silently extending the waiver.
  - id: CVE-2026-33818
    paths: ["usr/local/bin/docker"]
    expired_at: 2026-09-20
    statement: Awaiting an official Docker CLI binary built with Go 1.26.6 or newer.
  - id: CVE-2026-39821
    paths: ["usr/local/bin/docker"]
    expired_at: 2026-09-20
    statement: Awaiting an official Docker CLI binary built with Go 1.26.6 or newer.

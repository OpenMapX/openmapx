enum OccupancyEnumeration {
  FEW_SEATS_AVAILABLE
  FULL
  MANY_SEATS_AVAILABLE
  NOT_ACCEPTING_PASSENGERS
  SEATS_AVAILABLE
  STANDING_AVAILABLE
  UNKNOWN

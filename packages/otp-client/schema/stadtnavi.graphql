  carPark(id: String!): CarPark @deprecated(reason: "carPark is deprecated. Use vehicleParking instead.")
  carParks(ids: [String]): [CarPark] @deprecated(reason: "carParks is deprecated. Use vehicleParkings instead.")
  cluster(id: String!): Cluster @deprecated(reason: "Not implemented")
  clusters: [Cluster] @deprecated(reason: "Not implemented")
  departureRow(id: String!): DepartureRow
  feeds: [Feed]

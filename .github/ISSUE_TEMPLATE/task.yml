name: 🛠️ Task
description: Track maintenance, an investigation or technical work
type: Task
labels: [needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for maintenance or an investigation. For bugs, new features or providers, use the corresponding form.
        Link [related issues](https://github.com/OpenMapX/openmapx/issues?q=is%3Aissue) and describe what is known.
        Maintainers refine the scope, acceptance criteria and estimates during triage; you do not need an implementation plan.
  - type: textarea
    id: objective
    attributes:
      label: What needs to be done, and why?
      description: Describe the work or investigation and the reason for it. Link supporting evidence if available.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and open questions (if known)
      description: Mention relevant boundaries, constraints or decisions still needed. Leave unknown details for triage.
  - type: textarea
    id: completion-criteria
    attributes:
      label: What would show that this is complete?
      description: Suggest an observable result or a way to check it. For an investigation, list the questions to answer; maintainers can refine this.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies (optional)
      description: Link prerequisites or unresolved decisions if known. Leave blank if none are known.

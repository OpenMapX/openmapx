name: 🛠️ Task
description: Track maintenance, an investigation or technical work
type: Task
labels: [needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Describe the objective and what is known. Use the bug, feature or integration form for those reports.
        Unknowns are useful: maintainers refine acceptance criteria, dependencies and estimates during triage.
        Check existing issues if you can; no source-code knowledge is required.
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What should this work achieve, and why? Link relevant evidence if available.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and open questions
      description: Describe the boundaries you know. Say Unknown rather than inventing implementation details.
    validations:
      required: true
  - type: textarea
    id: completion-criteria
    attributes:
      label: How would we know it is complete?
      description: Suggest observable outcomes or evidence. For an investigation, list the questions to answer; maintainers can refine these criteria.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies (optional)
      description: Link prerequisites or unresolved decisions if known. None known or Unknown are both useful answers.

name: 🐛 Bug report
description: Report something that does not work as expected
type: Bug
labels: [needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Tell us what you observed; you do not need to know the cause or design a fix.
        Unknown versions and intermittent problems are welcome. Check existing issues if you can.
        For usage help, use [Discussions](https://github.com/OpenMapX/openmapx/discussions).
        Report vulnerabilities [privately](https://github.com/OpenMapX/openmapx/security/advisories/new),
        with the email fallback in [SECURITY.md](https://github.com/OpenMapX/openmapx/blob/main/SECURITY.md).
        Do not include secrets, personal coordinates or private route history.
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Describe what you saw and when it happened. Separate observations from possible explanations.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How can we reproduce it?
      description: Give the steps or what you have tried. If it is intermittent or you cannot reproduce it reliably, say so.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Running version
      description: Release/tag, installed release-manifest ID or image digest, or mobile app version. Use Unknown if unavailable. A local Git SHA only identifies a deployment if that checkout built the running images.
      placeholder: "v0.x preview, manifest ID, image digest, app version, or Unknown"
    validations:
      required: true
  - type: dropdown
    id: environment-kind
    attributes:
      label: Where does it happen?
      options:
        - Hosted app (openmapx.com)
        - Self-hosted deployment
        - Android app
        - iOS app
        - Local development
        - Not sure
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser and OS, or device/app version. For self-hosting, include relevant services and Docker versions if known.
  - type: dropdown
    id: area
    attributes:
      label: Affected area, if known
      multiple: true
      options:
        - Map or search
        - Routes or navigation
        - Mobile app
        - API or integration
        - Admin or self-hosting
        - Data pipeline
        - Documentation
        - Other / not sure
  - type: textarea
    id: map-context
    attributes:
      label: Map, route or provider context (optional)
      description: A rough public area, enabled layer/provider, travel mode or safe example route can help. Avoid home/work locations and private coordinates. Say Unknown where needed.
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots, logs or other evidence (optional)
      description: Attach screenshots or paste relevant errors. Redact tokens, secrets, personal data and sensitive coordinates. Mention the last working version or attempted workarounds if known.

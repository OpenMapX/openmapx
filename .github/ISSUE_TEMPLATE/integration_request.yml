name: 🧩 New integration / provider
description: Suggest a data source, provider or backend service
type: Feature
labels: [integration, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Suggest one source or service per request and link any [related issues](https://github.com/OpenMapX/openmapx/issues?q=is%3Aissue).
        Share the details you know; access, licensing and implementation details can remain unknown.
        Maintainers check these before implementation. See the [integration guide](https://docs.openmapx.org/developer/integration-system/).
        Do not paste API keys, account details or personal locations.
  - type: input
    id: provider-name
    attributes:
      label: Provider or source name
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: What would this enable?
      description: What data or capability would it add, and when would someone use it? Mention any gap in the existing integrations.
    validations:
      required: true
  - type: input
    id: provider-url
    attributes:
      label: Official website or documentation (if known)
      description: Link the provider, dataset or API documentation so maintainers can investigate.
      placeholder: "https://…"
  - type: dropdown
    id: domain
    attributes:
      label: Capability
      multiple: true
      options:
        - Search or geocoding
        - Routing or navigation
        - Public transit
        - Mobility or charging
        - Weather or air quality
        - Places or reviews
        - Map layer
        - Photos or street imagery
        - Knowledge or enrichment
        - Backend service
        - Other / unknown
    validations:
      required: true
  - type: input
    id: coverage
    attributes:
      label: Geographic coverage (if known)
      description: Public regions or countries are enough; no personal coordinates needed.
  - type: dropdown
    id: access
    attributes:
      label: Access requirements (if known)
      options:
        - Open access, no key
        - Free API key
        - Paid or metered access
        - Self-hosted service
        - Unknown
  - type: textarea
    id: licensing
    attributes:
      label: Rights and attribution (if known)
      description: Link the official data license, API terms or attribution requirements. Leave blank if unknown.
  - type: textarea
    id: context
    attributes:
      label: Additional context (optional)
      description: Examples, limitations, existing tools that use this source or an offer to help.

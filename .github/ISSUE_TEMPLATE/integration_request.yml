name: 🧩 New integration / provider
description: Suggest a data source, provider or backend service
type: Feature
labels: [integration, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Share what you know; access, licensing or technical details may be Unknown.
        Maintainers qualify rights, privacy, source policy and attribution before implementation.
        See the [integration guide](https://docs.openmapx.org/developer/integration-system/).
        Do not paste API keys, account details or personal locations.
  - type: input
    id: provider-name
    attributes:
      label: Provider or source name
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: What would this enable?
      description: Describe the capability or gap this source would address.
    validations:
      required: true
  - type: input
    id: provider-url
    attributes:
      label: Website or data documentation (if known)
      placeholder: "https://…"
  - type: dropdown
    id: domain
    attributes:
      label: Capability
      multiple: true
      options:
        - Search or geocoding
        - Routing or navigation
        - Public transit
        - Mobility or charging
        - Weather or air quality
        - Places or reviews
        - Map layer
        - Photos or street imagery
        - Knowledge or enrichment
        - Backend service
        - Other / unknown
    validations:
      required: true
  - type: input
    id: coverage
    attributes:
      label: Geographic coverage (if known)
      description: Public regions or countries are enough; no personal coordinates needed.
  - type: dropdown
    id: access
    attributes:
      label: Access requirements (if known)
      options:
        - Open access, no key
        - Free API key
        - Paid or metered access
        - Self-hosted service
        - Unknown
  - type: textarea
    id: licensing
    attributes:
      label: Rights and attribution (if known)
      description: Link terms or license information if available. Unknown is fine; do not guess or promise that the data is reusable.
  - type: textarea
    id: context
    attributes:
      label: Other context or implementation ideas (optional)
      description: Existing service support, limitations or an offer to help.

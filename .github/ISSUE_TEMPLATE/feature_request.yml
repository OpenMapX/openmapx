name: ✨ Feature request
description: Suggest a capability or improvement
type: Feature
labels: [needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Describe the need and desired result; you do not need an implementation plan.
        Check existing issues if you can. For a new data source or backend, use the integration/provider form.
        Early ideas and usage questions can go in [Discussions](https://github.com/OpenMapX/openmapx/discussions).
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Who encounters it, and in what situation? A concrete example helps.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What should become possible?
      description: Describe the result you want, without needing to specify code or UI details.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Possible approach or alternatives (optional)
      description: Share ideas, workarounds or related tools if useful. Leave this blank if you are unsure.
  - type: dropdown
    id: area
    attributes:
      label: Area, if known
      options:
        - Web or map
        - Mobile app
        - API or integration
        - CLI or self-hosting
        - Data pipeline
        - Documentation
        - Other / not sure
  - type: dropdown
    id: contribution
    attributes:
      label: Would you like to work on it? (optional)
      options:
        - "Yes"
        - "Maybe, with guidance"
        - "No, just suggesting"

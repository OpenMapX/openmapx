name: ✨ Feature request
description: Suggest a capability or improvement
type: Feature
labels: [needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Focus on one idea per request. [Search existing issues](https://github.com/OpenMapX/openmapx/issues?q=is%3Aissue)
        and link related requests. For a new data source or backend, use the integration/provider form.
        You do not need to design the implementation. Open-ended ideas and usage questions can go in [Discussions](https://github.com/OpenMapX/openmapx/discussions).
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe a situation where this would help and who would benefit. A concrete example is useful.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What would you like to be able to do?
      description: Describe the outcome you want. You can suggest an approach, but implementation details are optional.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds (optional)
      description: How do you handle this today? Mention other approaches or tools you have considered.
  - type: textarea
    id: context
    attributes:
      label: Additional context (optional)
      description: Links, examples, sketches or related discussions. If you would like to help work on this, let us know here.

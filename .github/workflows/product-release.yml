name: Prepare or publish a named product prerelease

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Prepare a draft or publish an approved candidate
        required: true
        type: choice
        options: [prepare, publish]
      source_run_id:
        description: Successful main CI run ID (prepare only)
        type: string
      version:
        description: Exact v-prefixed version (publish only)
        type: string
      candidate_hash:
        description: Exact candidate SHA256 from the draft (publish only)
        type: string

permissions:
  contents: read

# Named publishing is serialized. GitHub does not promise FIFO or retain every pending run.
concurrency:
  group: named-product-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && inputs.operation == 'prepare'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Stage exact candidate metadata and durable draft assets
        run: node scripts/product-release.mjs prepare
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}

  inspect:
    if: github.ref == 'refs/heads/main' && inputs.operation == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Push access is required to discover tagless drafts; no mutation occurs in inspect.
      contents: write
      actions: read
      packages: read
    outputs:
      approval_hash: ${{ steps.candidate.outputs.approvalHash }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Display exact candidate and readiness before owner approval
        id: candidate
        run: node scripts/product-release.mjs inspect
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT_VERSION: ${{ inputs.version }}
          EXPECTED_CANDIDATE_HASH: ${{ inputs.candidate_hash }}

  publish:
    needs: inspect
    if: github.ref == 'refs/heads/main' && inputs.operation == 'publish'
    environment: named-release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.1
          cache: true
      # Maintainer administration readback lives in bound readiness.json; GITHUB_TOKEN
      # cannot read immutable-release settings. No new publishing token is introduced.
      - name: Revalidate, scan and promote without rebuilding product images
        run: node scripts/product-release.mjs publish
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT_VERSION: ${{ inputs.version }}
          EXPECTED_CANDIDATE_HASH: ${{ inputs.candidate_hash }}
          EXPECTED_APPROVAL_HASH: ${{ needs.inspect.outputs.approval_hash }}

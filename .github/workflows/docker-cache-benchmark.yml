name: Measure Docker cache policies

on:
  workflow_dispatch:
    inputs:
      samples:
        description: Replicates per policy (each runs three API builds)
        type: choice
        options: ["2", "1"]
        default: "2"

permissions:
  contents: read

concurrency:
  group: docker-cache-benchmark
  cancel-in-progress: false

env:
  # The compact receipts below are sufficient; no image or build-record archive
  # is published by this experiment. Production attestations/scans stay intact.
  DOCKER_BUILD_RECORD_UPLOAD: "false"
  # Each case already saved its receipts and removed its builder before post-job.
  DOCKER_BUILD_SUMMARY: "false"

jobs:
  measure:
    name: Benchmark ${{ matrix.policy }} / sample ${{ matrix.sample }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        policy: [max, min, main-only]
        sample: ${{ fromJSON(inputs.samples == '1' && '[1]' || '[1,2]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Cold security refresh
        uses: ./.github/actions/docker-cache-case
        with:
          policy: ${{ matrix.policy }}
          sample: ${{ matrix.sample }}
          phase: cold
          output: ${{ runner.temp }}/cache-results
      - name: Following unchanged build
        uses: ./.github/actions/docker-cache-case
        with:
          policy: ${{ matrix.policy }}
          sample: ${{ matrix.sample }}
          phase: unchanged
          output: ${{ runner.temp }}/cache-results
      - name: Following source-only build
        uses: ./.github/actions/docker-cache-case
        with:
          policy: ${{ matrix.policy }}
          sample: ${{ matrix.sample }}
          phase: source
          output: ${{ runner.temp }}/cache-results
      - name: Preserve receipts, including partial failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cache-benchmark-${{ matrix.policy }}-${{ matrix.sample }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cache-results
          if-no-files-found: error
          retention-days: 14
  summary:
    name: Summarize cache experiment
    needs: measure
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cache-benchmark-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cache-results
      - name: Record attempt, queue, runner and repository cache metrics
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          OUTPUT: ${{ runner.temp }}/cache-results
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const attempt = Number(process.env.GITHUB_RUN_ATTEMPT);
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {
              ...context.repo, run_id: context.runId, attempt_number: attempt, per_page: 100,
            });
            const run = await github.rest.actions.getWorkflowRunAttempt({
              ...context.repo, run_id: context.runId, attempt_number: attempt,
            });
            const caches = await github.paginate(github.rest.actions.getActionsCacheList, {
              ...context.repo, per_page: 100,
            });
            const metrics = {
              run: context.runId, attempt, source: context.sha,
              createdAt: run.data.created_at, startedAt: run.data.run_started_at,
              jobs: jobs.filter(job => job.name.startsWith('Benchmark ')).map(job => ({
                name: job.name, startedAt: job.started_at, completedAt: job.completed_at,
                status: job.status, conclusion: job.conclusion, runner: job.runner_name,
              })),
              // Shared blobs cannot be attributed using scope-index size alone.
              repositoryCacheBytesObserved: caches.reduce((sum, cache) => sum + cache.size_in_bytes, 0),
            };
            fs.writeFileSync(path.join(process.env.OUTPUT, 'job-metrics.json'), JSON.stringify(metrics, null, 2));
      - name: Require complete comparable samples
        env:
          OUTPUT: ${{ runner.temp }}/cache-results
          SAMPLES: ${{ inputs.samples }}
          MATRIX_RESULT: ${{ needs.measure.result }}
        run: node scripts/docker-cache-benchmark.mjs report "$OUTPUT" "$SAMPLES"
      - name: Preserve complete or failed comparison
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cache-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cache-results
          if-no-files-found: error
          retention-days: 14

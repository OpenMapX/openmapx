name: CI

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  # Reconcile main daily, including merges made with GITHUB_TOKEN that do not
  # trigger push workflows. The planner cold-refreshes images after seven days;
  # the same tests and trusted-main release gate run before publication.
  schedule:
    - cron: "23 8 * * *"

# Metadata events never cancel code work. Main validation uses per-job latest-
# source concurrency; this workflow must never cancel an executing publication.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}-{1}', github.event.pull_request.number, github.event.action == 'edited' && !github.event.changes.base && 'metadata' || 'code') || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base != null) }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1

# The gate jobs (lint, types, tests, mobile, database, app/package build, and
# pull-request Docker build) run in parallel; the final
# `ci` job aggregates them under the job name `lint / types / test`, which is
# the required status check in the "main protection" ruleset. Renaming that
# job (or letting it skip) breaks branch protection — see
# docs/plans/2026-06-12-branch-protection.md.
jobs:
  select:
    name: select required validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      plan: ${{ steps.select.outputs['plan'] }}
      database-matrix: ${{ steps.select.outputs['database-matrix'] }}
      code: ${{ steps.select.outputs['code'] }}
      head: ${{ steps.select.outputs['head'] }}
      base: ${{ steps.select.outputs['base'] }}
      lint: ${{ steps.select.outputs['lint'] }}
      types: ${{ steps.select.outputs['types'] }}
      test-node: ${{ steps.select.outputs['test-node'] }}
      test-linux-user: ${{ steps.select.outputs['test-linux-user'] }}
      test-agent-mounts: ${{ steps.select.outputs['test-agent-mounts'] }}
      test-web: ${{ steps.select.outputs['test-web'] }}
      mobile: ${{ steps.select.outputs['mobile'] }}
      database: ${{ steps.select.outputs['database'] }}
      build: ${{ steps.select.outputs['build'] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Select checks from the complete immutable diff
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-impact-plan.mjs select
      - name: CI source v1 ${{ steps.select.outputs.source }}
        run: echo "Source binding recorded in the provider-owned step name."

  lint:
    needs: select
    if: needs.select.outputs.code == 'true' && needs.select.outputs['lint'] == 'true'
    name: lint
    concurrency:
      group: ci-validation-lint-${{ github.run_attempt == 1 && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref || format('run-{0}-attempt-{1}', github.run_id, github.run_attempt) }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Needed so commitlint can walk the PR's commit range (and so
          # the immutable PR base/head exist for release-information checks).
          # Quoted because `&& 0 || 1` short-circuits past the falsy 0 and always returns 1.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The root workspace intentionally excludes docs, while the image-parser
      # policy probe verifies both independently locked copies.
      - run: pnpm -C docs install --frozen-lockfile

      - name: Lint commit messages (PR only)
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from "${BASE_SHA}" --to "${HEAD_SHA}" --verbose
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - run: pnpm lint

      - name: Check repository policy invariants
        # Explicit local verification runs the same offline checks. Legal-date
        # freshness uses the committed PR diff; CI has no staged Git changes.
        # Live legal-URL and routing probes remain in scheduled workflows.
        run: pnpm check:policy
        env:
          OPENMAPX_POLICY_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}

      - name: Audit production dependencies
        # This live registry check stays out of local hooks. Current no-fix
        # advisories are narrowly versioned and expire for explicit review.
        run: pnpm check-production-audits

      - name: Check the release's service files and their history
        # The bundle embeds every file a built-in mounts; the history of each,
        # generated from Git, tells an operator's edit from an older release.
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --no-tags --unshallow origin
          fi
          pnpm check-service-files

      - name: Check the committed OpenAPI document matches the API surface
        # Mounts the route table in-process — no database, cache or network.
        run: pnpm check-openapi

      - name: Validate release information (PR only)
        if: github.event_name == 'pull_request'
        # Body edits must revalidate classification, including for Dependabot.
        # Read current metadata rather than a stale event body on a manual rerun.
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > "${RUNNER_TEMP}/release-pr.json"
          BASE_SHA="$(node -e 'const p=JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8")); if(!/^[a-f0-9]{40}$/.test(p.base?.sha)) process.exit(1); console.log(p.base.sha)' "${RUNNER_TEMP}/release-pr.json")"
          git fetch --no-tags origin "${BASE_SHA}"
          pnpm check-release-information --base "${BASE_SHA}" --head "${HEAD_SHA}" --pr-json "${RUNNER_TEMP}/release-pr.json"

  types:
    needs: select
    if: needs.select.outputs.code == 'true' && needs.select.outputs['types'] == 'true'
    name: types
    concurrency:
      group: ci-validation-types-${{ github.run_attempt == 1 && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref || format('run-{0}-attempt-{1}', github.run_id, github.run_attempt) }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Cache benefits check-types only (lint/test don't run through turbo);
      # revisit if root scripts move under turbo.
      - name: Restore Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - run: pnpm check-types

  # Reports the type errors in the TypeScript that `types` does not check
  # (repository scripts, integration tests, mobility-core). It is deliberately
  # absent from the `ci` job's needs: it never gates a merge, and it fails only
  # when a project cannot be type-checked at all, not because of the errors it
  # counts.
  types-unenforced:
    needs: select
    if: needs.select.outputs.code == 'true' && needs.select.outputs['types'] == 'true'
    name: types (not yet enforced)
    concurrency:
      group: ci-validation-types-unenforced-${{ github.run_attempt == 1 && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref || format('run-{0}-attempt-{1}', github.run_id, github.run_attempt) }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Count the type errors outside the required check
        run: pnpm check-types:unenforced --summary "$GITHUB_STEP_SUMMARY"

  test-node:
    needs: select
    if: needs.select.outputs.code == 'true' && needs.select.outputs['test-node'] == 'true'
    name: test (node)
    concurrency:
      group: ci-validation-test-node-${{ github.run_attempt == 1 && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref || format('run-{0}-attempt-{1}', github.run_id, github.run_attempt) }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Plain (uninstrumented) run — coverage is collected by the scheduled
      # coverage.yml workflow, not the PR gate. No OPENMAPX_SKIP_SLOW_CRYPTO:
      # that flag only compensates for v8 coverage instrumentation, so the
      # gate exercises the real crypto path.
      - run: pnpm test --project node

  # The operations agent's own image under both mount layouts it supports:
  # the whole checkout at its host path, as its manifest mounts it, and only
  # infra/docker (read-only) with its state, data, secrets and backups
  # directories, with the rest of the checkout gone from the host
  # (scripts/ops-agent-mount-layouts.test.ts, which only runs where
  # OPENMAPX_TEST_AGENT_IMAGE names the image built here).
  test-agent-mounts:
    needs: select
    if: needs.select.outputs.code == 'true' && needs.select.outputs['test-agent-mounts'] == 'true'
    name: test (ops-agent image, both mount layouts)
    concurrency:
      group: ci-validation-test-agent-mounts-${{ github.run_attempt == 1 && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref || format('run-{0}-attempt-{1}', github.run_id, github.run_attempt) }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      OPENMAPX_TEST_AGENT_IMAGE: openmapx-ci:ops-agent-mounts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Set up Docker Buildx
        id: buildx
        continue-on-error: true
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Retry Docker Buildx setup
        if: steps.buildx.outcome == 'failure'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Reads the cache the ops-agent Docker build writes; writes none itself.
      - name: Build the operations agent's image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/ops-agent/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.OPENMAPX_TEST_AGENT_IMAGE }}
          cache-from: type=gha,scope=ops-agent

      - run: pnpm exec vitest run --project node scripts/ops-agent-mount-layouts.test.ts

  # The agent, core and data-manager suites as a deployment whose operator is
  # not uid 1000 sees them: a non-root uid 1001 in a Debian Node container,
  # under the Debian and Ubuntu default umask 002, which leaves checkouts and
  # files group-writable. It also runs both update orders of the deployment's
  # user from an .env without UID/GID (scripts/ops-agent-deployment-user.test.ts),
  # which only runs where OPENMAPX_TEST_DEPLOYMENT_USER names the uid.
  test-linux-user:
    needs: select
    if: needs.select.outputs.code == 'true' && needs.select.outputs['test-linux-user'] == 'true'
    name: test (linux, uid 1001, umask 002, ${{ matrix.part }}/2)
    concurrency:
      group: ci-validation-test-linux-user-${{ github.run_attempt == 1 && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref || format('run-{0}-attempt-{1}', github.run_id, github.run_attempt) }}-${{ matrix.part }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    container:
      image: node:24.22.2-bookworm@sha256:e7add2a490bb17d97b485b8641bd88455fff7839ade0f5eba493c3508124d413
      # The runner's own uid, which owns the checked-out workspace. --init
      # reaps orphans as tini does in the agent's image: the job container's
      # own PID 1 never would, and the contained-process tests wait for a
      # command's process group to empty.
      options: --user 1001:1001 --init
    env:
      HOME: /tmp/home
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      OPENMAPX_TEST_DEPLOYMENT_USER: "1001"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Confirm the user and umask
        run: |
          umask 002
          mkdir -p "$HOME"
          echo "uid $(id -u) gid $(id -g) umask $(umask)"
          test "$(id -u)" = 1001 && test "$(umask)" = 0002

      - run: umask 002 && corepack pnpm install --frozen-lockfile

      - name: Run the agent, core and data-manager suites and the deployment-user test
        # One file worker reduces I/O contention between filesystem-heavy lease fixtures.
        env:
          OPENMAPX_TEST_SHARD_RECEIPT: ${{ runner.temp }}/linux-user-${{ matrix.part }}.json
        run: >-
          umask 002 && corepack pnpm exec node scripts/test-linux-user.mjs ${{ matrix.part }}/2

      - name: Preserve the Linux deployment-user inventory
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-user-shard-${{ matrix.part }}
          path: ${{ runner.temp }}/linux-user-${{ matrix.part }}.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  test-web:
    needs: select
    if: needs.select.outputs.code == 'true' && needs.select.outputs['test-web'] == 'true'
    name: test (web)
    concurrency:
      group: ci-validation-test-web-${{ github.run_attempt == 1 && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref || format('run-{0}-attempt-{1}', github.run_id, github.run_attempt) }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test --project web

  mobile:
    needs: select
    if: needs.select.outputs.code == 'true' && needs.select.outputs['mobile'] == 'true'
    name: test (mobile)
    concurrency:
      group: ci-validation-mobile-${{ github.run_attempt == 1 && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref || format('run-{0}-attempt-{1}', github.run_id, github.run_attempt) }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # React Native components, the bridge, coordinator, storage, permissions,
      # and background runtime use jest-expo and are intentionally outside both
      # root Vitest projects. Keep this portable suite in the required gate.
      - name: Test the mobile runtime
        run: pnpm --filter @openmapx/mobile test

      - name: Type-check the mobile runtime
        run: pnpm --filter @openmapx/mobile check-types

      - name: Verify the signed runtime boundary
        run: pnpm --filter @openmapx/mobile assert-boundary

      - name: Regenerate and verify deterministic native configuration
        # Generated native projects are intentionally ignored. Rebuild them
        # twice from committed config so this works in a clean checkout and
        # leaves the second generation available to the permission audit.
        run: pnpm mobile:prebuild:check

      - name: Verify generated permission surface
        run: pnpm --filter @openmapx/mobile assert-permissions

      - name: Verify mobile dependency inventory
        run: pnpm --filter @openmapx/mobile inventory

      # Metro bundles the real headless entry. This catches resolution and
      # accidental React/UI imports that Jest and TypeScript cannot detect.
      - name: Smoke-test the release background bundle
        run: pnpm mobile:bundle:check

  database:
    needs: select
    if: needs.select.outputs.code == 'true' && needs.select.outputs['database'] == 'true'
    name: test (database, ${{ matrix.group }}, ${{ matrix.part }}/${{ matrix.total }})
    concurrency:
      group: ci-validation-database-${{ github.run_attempt == 1 && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref || format('run-{0}-attempt-{1}', github.run_id, github.run_attempt) }}-${{ matrix.group }}-${{ matrix.part }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    # API/privacy includes the full native platform-helper recovery matrix.
    # Give native recovery groups headroom for setup and all serial suites;
    # individual test and execution deadlines remain independently enforced.
    timeout-minutes: ${{ contains(fromJSON('["api-privacy", "ingestion", "configuration-recovery", "coordinator-recovery"]'), matrix.group) && 90 || 30 }}
    strategy:
      # Each group has a separate runner and service; keep the other groups
      # running after a failure so all applicable evidence is collected.
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs['database-matrix']) }}
    services:
      postgis:
        # Match the production PostGIS line and pin the reviewed multi-arch
        # manifest rather than trusting a mutable registry tag.
        image: ghcr.io/baosystems/postgis:18-3.6@sha256:dd7515b7d8b8b8bac3516a9c3e12584df5890b0864c29295c1b934ecd1db81a7
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: openmapx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d openmapx_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/openmapx_test
      # This is a positive assertion that database infrastructure is required.
      # Once set, every selected suite fails instead of skipping if PostGIS or
      # the Docker daemon is unavailable.
      OPENMAPX_RUN_DATABASE_TESTS: "1"
      OPENMAPX_RUN_RESTORE_DATABASE_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply the production database migrations
        run: pnpm --filter @openmapx/api exec drizzle-kit migrate

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: matrix.group == 'ingestion'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/motis/tools/transitous/requirements.txt

      - name: Install Transitous runner Python dependencies
        if: matrix.group == 'ingestion'
        # Catalog workflows execute the real runner on the host in this job.
        # Its feed-proxy renderer needs the same packages as the runner image.
        run: python3 -m pip install --require-hashes -r services/motis/tools/transitous/requirements.txt

      # Docker Hub throttles and fails transiently. Pull the pinned digest with
      # backoff here so the fixtures, which forbid pulling themselves, only
      # spend their budget on the fixture itself. No Docker Hub login: the
      # workflow holds no Docker Hub credentials.
      - name: Pull the pinned extension-store Valkey image
        if: matrix.group == 'api-privacy'
        timeout-minutes: 10
        run: |
          image="$(node -e 'const {container: c} = require("./services/redis/service.json"); console.log(c.image + ":" + c.tag + "@" + c.digest)')"
          for backoff in 0 15 30 60 120; do
            sleep "$backoff"
            docker pull --quiet "$image" && exit 0
            echo "::warning::Pulling $image failed; retrying with backoff"
          done
          echo "::error::Could not pull $image after 5 attempts"
          exit 1

      # data-manager reads its Transitous API keys through a directory mount;
      # a running container must see the file generate-api-keys replaced.
      - name: Verify the Transitous API keys mount
        if: matrix.group == 'api-privacy' && matrix.part == 1
        timeout-minutes: 5
        run: |
          image="$(node -e 'const {container: c} = require("./services/redis/service.json"); console.log(c.image + ":" + c.tag + "@" + c.digest)')"
          OPENMAPX_RUN_SECRET_MOUNT_TESTS=1 OPENMAPX_SECRET_MOUNT_TEST_IMAGE="$image" pnpm exec vitest run --project node packages/cli/__tests__/transitous-api-keys-mount.integration.test.ts

      - name: Pull the pinned Traefik image
        if: matrix.group == 'api-privacy' && matrix.part == 1
        timeout-minutes: 10
        run: |
          image="$(node -e 'const {container: c} = require("./services/traefik/service.json"); console.log(c.image + ":" + c.tag + "@" + c.digest)')"
          for backoff in 0 15 30 60 120; do
            sleep "$backoff"
            docker pull --quiet "$image" && exit 0
            echo "::warning::Pulling $image failed; retrying with backoff"
          done
          echo "::error::Could not pull $image after 5 attempts"
          exit 1

      # Traefik watches its dynamic directory in the agent's state: a running
      # Traefik must serve the routes a render replaced there, and never see
      # the file missing or half-written.
      - name: Verify Traefik's dynamic directory
        if: matrix.group == 'api-privacy' && matrix.part == 1
        timeout-minutes: 5
        run: |
          image="$(node -e 'const {container: c} = require("./services/traefik/service.json"); console.log(c.image + ":" + c.tag + "@" + c.digest)')"
          OPENMAPX_RUN_TRAEFIK_TESTS=1 OPENMAPX_TRAEFIK_TEST_IMAGE="$image" pnpm exec vitest run --project node packages/core/src/services/__tests__/traefik-dynamic.integration.test.ts

      - name: Pull the pinned well-known and Valhalla images
        if: matrix.group == 'api-privacy' && matrix.part == 1
        timeout-minutes: 10
        run: |
          for id in well-known valhalla; do
            image="$(node -e 'const {container: c} = require("./services/" + process.argv[1] + "/service.json"); console.log(c.image + ":" + c.tag + "@" + c.digest)' "$id")"
            for backoff in 0 15 30 60 120 fail; do
              if [ "$backoff" = fail ]; then
                echo "::error::Could not pull $image after 5 attempts"
                exit 1
              fi
              sleep "$backoff"
              docker pull --quiet "$image" && break
              echo "::warning::Pulling $image failed; retrying with backoff"
            done
          done

      # Containers mount the release's files from the store beside the
      # generations: nginx's workers and PostGIS's user (neither root nor the
      # deployment's) read them, and Valhalla rewrites its writable copy.
      # PostGIS's pinned image is this job's own service image.
      - name: Verify service files mounted from the store
        if: matrix.group == 'api-privacy' && matrix.part == 1
        timeout-minutes: 10
        run: OPENMAPX_RUN_SERVICE_FILE_TESTS=1 pnpm exec vitest run --project node packages/core/src/services/__tests__/service-files.integration.test.ts

      - name: Pull the pinned managed Dawarich image
        if: matrix.group == 'export-restore'
        timeout-minutes: 10
        run: |
          image="freikin/dawarich@$(node --input-type=module -e 'const { DAWARICH_SUPPORTED_IMAGE_DIGEST } = await import("./packages/core/src/privacy/dawarich-contract.ts"); console.log(DAWARICH_SUPPORTED_IMAGE_DIGEST)')"
          for backoff in 0 15 30 60 120; do
            sleep "$backoff"
            docker pull --quiet "$image" && exit 0
            echo "::warning::Pulling $image failed; retrying with backoff"
          done
          echo "::error::Could not pull $image after 5 attempts"
          exit 1

      - name: Verify the pinned managed Dawarich subject export
        if: matrix.group == 'export-restore'
        timeout-minutes: 10
        run: OPENMAPX_RUN_DAWARICH_EXPORT_TESTS=1 pnpm exec vitest run --project node apps/ops-agent/src/dawarich-subject-export.integration.test.ts

      - name: Verify the isolated retained-backup export
        if: matrix.group == 'export-restore'
        timeout-minutes: 10
        run: node services/ops-agent/privacy-backup/test-fixture.mjs --output "$RUNNER_TEMP/openmapx-real-backup-result.tar"

      - name: Run the required database integration suites
        env:
          TEST_DB_GROUP: ${{ matrix.group }}
          TEST_DB_PART: ${{ matrix.part }}
          TEST_DB_TOTAL: ${{ matrix.total }}
          OPENMAPX_REAL_BACKUP_FIXTURE: ${{ runner.temp }}/openmapx-real-backup-result.tar
          OPENMAPX_TEST_SHARD_RECEIPT: ${{ runner.temp }}/database-${{ matrix.group }}-${{ matrix.part }}.json
        run: pnpm test:database "${TEST_DB_GROUP}" "${TEST_DB_PART}/${TEST_DB_TOTAL}"

      - name: Preserve the exact database shard inventory
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: database-shard-${{ matrix.group }}-${{ matrix.part }}
          path: ${{ runner.temp }}/database-${{ matrix.group }}-${{ matrix.part }}.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  build:
    needs: select
    if: needs.select.outputs.code == 'true' && needs.select.outputs['build'] == 'true'
    name: build (production)
    concurrency:
      group: ci-validation-build-${{ github.run_attempt == 1 && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref || format('run-{0}-attempt-{1}', github.run_id, github.run_attempt) }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NODE_OPTIONS: --max-old-space-size=6144
      # Turborepo declares this as a build input and the service-worker build
      # embeds it, matching the Docker workflow's deploy identity.
      SW_BUILD_ID: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Restore Turbo build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-build-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-build-${{ runner.os }}-
            turbo-${{ runner.os }}-

      - name: Build production applications, services, and packages
        run: pnpm build

      - name: Exercise the bundled data-manager worker threads
        run: OPENMAPX_RUN_BUILT_WORKER_TESTS=1 pnpm exec vitest run --project node services/data-manager/src/__tests__/live-writer-worker.test.ts services/data-manager/src/__tests__/offline-extractor-worker.test.ts

      - name: Install and exercise the packed public extension packages
        run: pnpm check-packed-packages

  docker-changes:
    name: select Docker targets
    needs: select
    if: github.event_name == 'pull_request' && needs.select.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      apps: ${{ steps.select.outputs.apps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Select deployable targets affected by this pull request
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/docker-release-plan.mjs changed "$BASE_SHA" "$HEAD_SHA"

  docker-build:
    name: build Docker (${{ matrix.app }})
    needs: [select, docker-changes]
    if: github.event_name == 'pull_request' && needs.select.outputs.code == 'true' && needs.docker-changes.outputs.apps != '[]' && needs.docker-changes.outputs.apps != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.docker-changes.outputs.apps) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve build context
        id: context
        env:
          APP: ${{ matrix.app }}
        run: |
          case "$APP" in
            api) echo "context=." >> "$GITHUB_OUTPUT"; echo "dockerfile=apps/api/Dockerfile" >> "$GITHUB_OUTPUT" ;;
            web) echo "context=." >> "$GITHUB_OUTPUT"; echo "dockerfile=apps/web/Dockerfile" >> "$GITHUB_OUTPUT" ;;
            data-manager) echo "context=." >> "$GITHUB_OUTPUT"; echo "dockerfile=services/data-manager/Dockerfile" >> "$GITHUB_OUTPUT" ;;
            ops-agent) echo "context=." >> "$GITHUB_OUTPUT"; echo "dockerfile=apps/ops-agent/Dockerfile" >> "$GITHUB_OUTPUT" ;;
            privacy-backup) echo "context=." >> "$GITHUB_OUTPUT"; echo "dockerfile=services/ops-agent/privacy-backup/Dockerfile" >> "$GITHUB_OUTPUT" ;;
            transitous-runner) echo "context=." >> "$GITHUB_OUTPUT"; echo "dockerfile=apps/transitous-runner/Dockerfile" >> "$GITHUB_OUTPUT" ;;
            transitous-tools) echo "context=services/motis/tools/transitous" >> "$GITHUB_OUTPUT"; echo "dockerfile=services/motis/tools/transitous/Dockerfile" >> "$GITHUB_OUTPUT" ;;
            docs) echo "context=docs" >> "$GITHUB_OUTPUT"; echo "dockerfile=docs/Dockerfile" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unknown Docker target: $APP" >&2; exit 1 ;;
          esac

      - name: Set up Docker Buildx
        id: buildx
        continue-on-error: true
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Retry Docker Buildx setup
        if: steps.buildx.outcome == 'failure'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build deployable target without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ steps.context.outputs.context }}
          file: ${{ steps.context.outputs.dockerfile }}
          platforms: linux/amd64
          build-args: ${{ matrix.app == 'web' && format('SW_BUILD_ID={0}', github.sha) || '' }}
          push: false
          load: true
          tags: openmapx-ci:${{ matrix.app }}
          pull: ${{ matrix.app == 'docs' }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=${{ matrix.app == 'api' && 'min' || 'max' }},scope=${{ matrix.app }}

      # Scan the image just built on this runner; PRs never need registry
      # credentials. Main independently rescans exact digests before promotion.
      - name: Gate built PR image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IMAGE_SRC: docker
        with:
          version: v0.76.1
          image-ref: openmapx-ci:${{ matrix.app }}
          format: table
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: "true"
          trivyignores: .trivyignore.yaml
          exit-code: "1"

  # Every open-PR suite executes the stable required gate, even after upstream
  # failure. A metadata suite must recheck code evidence, never post a green skip.
  ci:
    # Every PR suite must contain an executing required gate, including edits.
    # A skipped or dynamically renamed job cannot preserve older-suite evidence.
    name: lint / types / test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    needs:
      [
        select,
        lint,
        types,
        test-node,
        test-linux-user,
        test-agent-mounts,
        test-web,
        mobile,
        database,
        build,
        docker-changes,
        docker-build,
      ]
    if: always() && github.event.pull_request.state != 'closed' && (github.event_name == 'pull_request' || needs.select.result != 'success' || needs.select.outputs.code != 'false')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Collect database partition receipts
        if: needs.select.outputs.code == 'true' && needs.select.outputs.database == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: database-shard-*
          merge-multiple: true
          path: ${{ runner.temp }}/database-shards
      - name: Require the complete disjoint database inventory
        if: needs.select.outputs.code == 'true' && needs.select.outputs.database == 'true'
        run: node scripts/database-test-shards.mjs verify "${{ runner.temp }}/database-shards"
      - name: Collect Linux deployment-user receipts
        if: needs.select.outputs.code == 'true' && needs.select.outputs['test-linux-user'] == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: linux-user-shard-*
          merge-multiple: true
          path: ${{ runner.temp }}/linux-user-shards
      - name: Require the complete Linux deployment-user inventory
        if: needs.select.outputs.code == 'true' && needs.select.outputs['test-linux-user'] == 'true'
        run: node scripts/database-test-shards.mjs verify-linux "${{ runner.temp }}/linux-user-shards"
      - name: Require every selected validation result
        if: needs.select.outputs.code != 'false' || needs.select.result != 'success'
        env:
          CI_PLAN: ${{ needs.select.outputs.plan }}
          CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_BASE: ${{ github.event.pull_request.base.sha || '' }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-impact-plan.mjs verify

      - name: Revalidate successful code evidence for metadata edits
        if: needs.select.result == 'success' && needs.select.outputs.code == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          CI_PLAN: ${{ needs.select.outputs.plan }}
          CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_BASE: ${{ github.event.pull_request.base.sha || '' }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-impact-plan.mjs verify-reuse

  release:
    name: build, scan, and publish Docker release
    needs: ci
    # The aggregate gate intentionally depends on PR-only Docker jobs, which
    # are skipped on pushes. Force evaluation past GitHub's transitive skipped-
    # dependency propagation, then admit trusted main pushes and refresh runs.
    if: always() && needs.ci.result == 'success' && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: ./.github/workflows/docker.yml # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ form

name: Link check

on:
  schedule:
    - cron: "30 7 * * 1" # Mondays 07:30 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    name: check links in docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # to open, update or close the broken-links issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Markdown across the repo; node_modules and other gitignored paths are
          # skipped automatically. Tune ignored URLs in .lycheeignore.
          # Docusaurus serves root-relative links: /img/... from docs/static and
          # /<section>/<page> from docs/docs/<section>/<page>.md(x). Resolve both
          # so lychee checks those targets exist instead of reporting them as
          # unresolvable.
          args: >-
            --no-progress --cache --max-cache-age 1d
            --exclude-path infra/docker/data
            --root-dir ${{ github.workspace }}/docs/static
            --remap 'file://${{ github.workspace }}/docs/static/(administration|developer|features|guides|install|overview|releases)/(.+) file://${{ github.workspace }}/docs/docs/$1/$2'
            --fallback-extensions md,mdx
            './**/*.md' './**/*.mdx'
          fail: false # don't fail the run; we report via an issue instead
      - name: Find existing broken-links issue
        id: find-issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = 'Broken links found by lychee';
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existingIssue = issues.find(
              (issue) => !issue.pull_request && issue.title === title,
            );

            if (existingIssue) {
              core.setOutput('issue-number', String(existingIssue.number));
            }
      - name: Open an issue on broken links
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        with:
          title: Broken links found by lychee
          content-filepath: ./lychee/out.md
          issue-number: ${{ steps.find-issue.outputs.issue-number }}
          # Token-created issues do not trigger the lifecycle workflow. Add
          # initial triage here without re-triaging an existing report.
          labels: ${{ steps.find-issue.outputs.issue-number == '' && 'documentation, needs-triage' || 'documentation' }}
      - name: Close the broken-links issue after a clean run
        if: steps.lychee.outputs.exit_code == 0 && steps.find-issue.outputs.issue-number != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ISSUE_NUMBER: ${{ steps.find-issue.outputs.issue-number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const issue_number = Number(process.env.ISSUE_NUMBER);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: `The [latest link check](${process.env.RUN_URL}) found no broken links.`,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              state: 'closed',
              state_reason: 'completed',
            });

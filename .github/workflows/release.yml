name: Release

# Manual-only: this repo deploys via Docker images and publishes nothing to
# npm, so versioning/release runs on demand rather than on every push to main.
# Trigger from the Actions tab ("Run workflow") when you actually want to cut a
# release from the pending changesets.
on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Least-privilege default; the release job escalates to only what changesets
# needs: push the version commit/tags + GitHub releases (contents) and open the
# "Version Packages" PR (pull-requests). No id-token — npm publish/OIDC
# provenance is disabled.
permissions:
  contents: read

jobs:
  release:
    name: Version / publish
    # workflow_dispatch lets a caller pick any ref, so refuse to run this
    # privileged job (contents/PR write + checkout + install) on anything but
    # main — a malicious branch can't use it to execute code with write scope.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Opens / updates a "Version Packages" PR while there are unreleased
      # changesets. When that PR is merged, the action tags the release.
      # Publishing to npm is intentionally disabled — uncomment `publish:`
      # and add the NPM_TOKEN secret if/when packages are published.
      - name: Create release PR
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          version: pnpm exec changeset version
          commit: "chore: version packages"
          title: "chore: version packages"
          createGithubReleases: true
          # publish: pnpm exec changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

name: Dead-code audit

on:
  # Knip is not a required check: this monorepo has convention-loaded
  # integrations and generated entry points, so config changes deserve review
  # instead of blocking unrelated pull requests. It does run on pull requests
  # that change what it judges most often, dependency manifests and files that
  # tests or builds load by path, so the author sees a new finding before merge
  # instead of the weekly run turning red afterwards.
  pull_request:
    paths:
      - "**/package.json"
      - "pnpm-lock.yaml"
      - "knip.jsonc"
      - "**/fixtures/**"
      - "**/__fixtures__/**"
      - "scripts/build-runtime-bundles.mjs"
      - ".github/workflows/dead-code.yml"
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: dead-code-${{ github.workflow }}-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  knip:
    name: unused files and dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Audit unused files and dependencies
        run: pnpm check-dead-code

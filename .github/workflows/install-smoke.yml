name: Install smoke

# Builds the five application images from the checkout and follows the
# documented fresh install against them (scripts/ci/install-smoke.sh). The job
# is expensive, so pull requests run it only when they touch what the install
# path executes; main and a nightly run cover everything else.
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "41 3 * * *"
  pull_request:
    paths:
      - packages/cli/**
      - packages/core/src/services/**
      - packages/core/src/build-artifacts/**
      - apps/ops-agent/**
      - services/**
      - infra/docker/**
      - apps/*/Dockerfile
      - scripts/ci/install-smoke.sh
      - .github/workflows/install-smoke.yml

# A newer push replaces a running pull-request check; main and the nightly run
# always finish.
concurrency:
  group: install-smoke-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  install-smoke:
    name: fresh install
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install, start and check the stack
        run: bash scripts/ci/install-smoke.sh

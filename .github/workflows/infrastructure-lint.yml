name: Infrastructure lint

on:
  pull_request:
    paths:
      - ".github/**"
      - "**/Dockerfile"
      - "**/*.sh"
      - ".hadolint.yaml"
  push:
    branches: [main]
    paths:
      - ".github/**"
      - "**/Dockerfile"
      - "**/*.sh"
      - ".hadolint.yaml"
  workflow_dispatch:

concurrency:
  group: infrastructure-lint-${{ github.workflow }}-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: workflows, shell, and Dockerfiles
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint, ShellCheck, and Hadolint
        run: bash scripts/check-infrastructure.sh

      - name: Audit GitHub Actions security
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: v1.31.1
          advanced-security: false
          annotations: true

name: PR Title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  # `pull-requests: write` is needed because `wip: true` makes the action
  # set the PR check to "pending" while the title contains [WIP].
  # See: https://github.com/amannn/action-semantic-pull-request#wip
  pull-requests: write

jobs:
  validate:
    name: Validate conventional commit title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            ci
            build
            perf
            style
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" must start with a lowercase letter.
            Example: `fix: validate service-repo hash params` (not `Fix: ...`).
          wip: true

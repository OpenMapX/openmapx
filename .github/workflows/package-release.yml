name: Independent qualified package release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Prepare a version PR, qualify bootstrap artifacts, or publish a merged batch
        required: true
        type: choice
        options: [version, qualify, publish]
      version_pr:
        description: Merged canonical version PR number (publish only)
        type: string
      source_run_id:
        description: Successful main CI run for this exact dispatch SHA (publish only)
        type: string

permissions:
  contents: read

# Approval/publication must finish before another batch can start. Pending runs
# are not a durable queue; GitHub does not promise FIFO.
concurrency:
  group: qualified-package-release
  cancel-in-progress: false

jobs:
  version:
    if: github.ref == 'refs/heads/main' && inputs.operation == 'version'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Validate the qualified queue; empty means no operation
        id: queue
        run: node scripts/version-public-packages.mjs --check
      - uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        id: version
        if: steps.queue.outputs.pending != '0'
        with:
          script: node scripts/version-public-packages.mjs
          pr-title: "chore(release): version qualified public packages"
          commit-message: "chore(release): version qualified public packages"
          pr-base-branch: main
      - name: Describe the canonical PR and its actual CI limits
        if: steps.version.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.version.outputs.pr-number }}
        run: |
          cat > "${RUNNER_TEMP}/package-version-pr.md" <<'BODY'
          ## What changed and why

          Prepare the pending qualified package batch with installed Changesets and canonical schema-ID updates. Review the package versions, changelogs and consumed notes in the diff. Merge does not publish anything.

          ## Verification

          Queue validation and canonical generation ran during preparation. Required PR CI must pass: a maintainer must approve and run the bot-created PR workflows. This workflow neither approves nor merges the PR. Package qualification runs separately before publishing approval.

          ## Release and upgrade impact

          Package release: version
          BODY
          gh pr edit "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --body-file "${RUNNER_TEMP}/package-version-pr.md" --add-assignee Medformatik --add-label ci
          gh pr view "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --json url,body,assignees,labels

  qualify:
    if: github.ref == 'refs/heads/main' && (inputs.operation == 'qualify' || inputs.operation == 'publish')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      candidate_hash: ${{ steps.candidate.outputs.candidate_hash }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Qualify exact tarballs and show source, batch and integrity before approval
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_OPERATION: ${{ inputs.operation }}
          PACKAGE_RELEASE_STAGE: qualify
          PACKAGE_ARTIFACT_DIRECTORY: ${{ runner.temp }}/package-candidate
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          VERSION_PR: ${{ inputs.version_pr }}
        run: node scripts/package-release.mjs "${PACKAGE_OPERATION}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: package-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/package-candidate/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: qualify
    if: github.ref == 'refs/heads/main' && inputs.operation == 'publish'
    environment: named-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.qualify.outputs.artifact_id }}
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/package-candidate
          merge-multiple: true
      - name: Revalidate approved bytes, publish with npm OIDC, verify provenance and exact tags
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_RELEASE_STAGE: publish
          PACKAGE_ARTIFACT_DIRECTORY: ${{ runner.temp }}/package-candidate
          PACKAGE_ARTIFACT_ID: ${{ needs.qualify.outputs.artifact_id }}
          PACKAGE_CANDIDATE_HASH: ${{ needs.qualify.outputs.candidate_hash }}
        run: node scripts/package-release.mjs publish

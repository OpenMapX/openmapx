name: Legal URLs

on:
  schedule:
    # Weekly on Mondays at 05:23 UTC. Dead privacy/license links rot over time
    # independently of code changes, so this runs on a schedule rather than per
    # commit/PR — a network check is too flaky to gate the dev flow (a provider
    # being briefly down would otherwise block unrelated work). The offline
    # check:policy still runs the offline legal-table guard in regular CI to
    # ensure the URL fields are present at PR time.
    - cron: "23 5 * * 1"
  workflow_dispatch:

concurrency:
  group: legal-urls-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  legal-urls:
    name: privacy + license URL liveness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check legal URLs
        # Fails the run (404/410/5xx/DNS failure). Bot-blocks, rate-limits and
        # transient errors are reported as non-blocking. Run locally with
        # `pnpm check-legal-urls`.
        run: pnpm check-legal-urls

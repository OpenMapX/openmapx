version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 10
    versioning-strategy: increase-if-necessary
    labels: [dependencies]
    commit-message:
      prefix: chore
      include: scope
    groups:
      eslint-and-formatters:
        patterns:
          - "@biomejs/*"
          - "eslint*"
          - "prettier*"
      typescript-toolchain:
        patterns:
          - "typescript"
          - "@types/*"
          - "tsx"
          - "tsup"
      next-stack:
        patterns:
          - "next"
          - "next-*"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      mui-stack:
        patterns:
          - "@mui/*"
          - "@emotion/*"
      tanstack:
        patterns:
          - "@tanstack/*"
      maplibre-stack:
        patterns:
          - "maplibre-*"
          - "@maplibre/*"
          - "mapillary-*"
      better-auth:
        patterns:
          - "better-auth"
          - "@better-auth/*"
      turbo-changesets:
        patterns:
          - "turbo"
          - "@changesets/*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    labels: [dependencies, ci]
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    # Cover every Dockerfile so the digest-pinned base images get bumped (a
    # frozen digest only stays secure if something keeps it current).
    directories:
      - "/infra/docker"
      - "/apps/api"
      - "/apps/web"
      - "/docs"
      - "/services/data-manager"
      - "/services/motis/tools/transitous"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    labels: [dependencies, docker]
    commit-message:
      prefix: chore
      include: scope

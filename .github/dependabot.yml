version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 10
    versioning-strategy: increase-if-necessary
    labels: [dependencies]
    commit-message:
      prefix: chore
      include: scope
    groups:
      eslint-and-formatters:
        patterns:
          - "@biomejs/*"
          - "eslint*"
          - "prettier*"
      typescript-toolchain:
        patterns:
          - "typescript"
          - "@types/*"
          - "tsx"
          - "tsup"
      next-stack:
        patterns:
          - "next"
          - "next-*"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      mui-stack:
        patterns:
          - "@mui/*"
          - "@emotion/*"
      tanstack:
        patterns:
          - "@tanstack/*"
      maplibre-stack:
        patterns:
          - "maplibre-*"
          - "@maplibre/*"
          - "mapillary-*"
      better-auth:
        patterns:
          - "better-auth"
          - "@better-auth/*"
      turbo-changesets:
        patterns:
          - "turbo"
          - "@changesets/*"
    ignore:
      # @types/node tracks the Node runtime (24 LTS); don't let it jump a major
      # ahead of the runtime — bump it deliberately when the Node version moves.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # The documentation site is a standalone pnpm workspace and is therefore
  # not covered by the root npm configuration above.
  - package-ecosystem: npm
    directory: "/docs"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 10
    versioning-strategy: increase-if-necessary
    labels: [dependencies, docs]
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # TypeScript 7 is not supported by this workspace yet; upgrade it with
      # the compiler API migration rather than as a transitive update.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    labels: [dependencies, ci]
    commit-message:
      prefix: ci
    ignore:
      # Pinned fork that provides the Node 24 runtime; the upstream 2.6.1 tag
      # regresses the runtime, so update this action by hand, not via Dependabot.
      - dependency-name: "OpenMapX/cla-assistant-action"

  - package-ecosystem: docker
    # Cover every Dockerfile so the digest-pinned base images get bumped (a
    # frozen digest only stays secure if something keeps it current).
    directories:
      - "/infra/docker"
      - "/apps/api"
      - "/apps/web"
      - "/docs"
      - "/services/data-manager"
      - "/services/motis/tools/transitous"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    labels: [dependencies, docker]
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # Stay on the Node 24 LTS base images; bump the Node major deliberately
      # (Dockerfiles + .nvmrc + engines + @types/node together), not piecemeal.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

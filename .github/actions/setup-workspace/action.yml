name: Set up the workspace
description: >-
  Installs the pinned pnpm and the Node version from .nvmrc with the pnpm store
  cache, then installs the workspace from the frozen lockfile. Run it after
  actions/checkout. Trusted and release workflows keep these steps inline.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash

# yaml-language-server: $schema=https://raw.githubusercontent.com/maplibre/martin/main/schemas/config.json
#
# Martin was previously run purely off `DATABASE_URL` (see service.json
# `container.environment`) with no config file — Martin auto-discovers all
# PostGIS tables/functions with zero config. This file exists ONLY to set the
# internal tile cache expiry below; per Martin's docs, once `--config` /
# `-c` is used the env-var shortcuts stop being read ("you can configure
# Martin using environment variables, but only if the configuration file is
# not used"), so the DB connection is re-declared here referencing the SAME
# `DATABASE_URL` env var, and everything else is left at its documented
# default so behavior is otherwise unchanged from the previous flag/env-only
# startup.

# Unchanged from Martin's own default (`0.0.0.0:3000`) — matches the
# container's `expose: [3000]` / Traefik proxy target in service.json.
# Declared explicitly so this file is a complete, self-describing config.
listen_addresses: "0.0.0.0:3000"

postgres:
  # `$VAR` / `${VAR:-default}` expansion is a documented Martin config
  # feature — this reuses the exact `DATABASE_URL` service.json already sets,
  # so no connection details are duplicated here.
  connection_string: $DATABASE_URL
  # `auto_publish` is left unset (default: null). With no `tables`/
  # `functions` block configured, Martin still auto-discovers every PostGIS
  # source, which is the same zero-config behavior it had before this file
  # existed. `segment_flow` (the traffic-flow overlay's live source, see
  # docs/plans/conditions/speed-congestion/10-traffic-flow-overlay.md) is
  # picked up this way — no source needs to be hand-declared.

# Martin's internal tile-response cache. By default `cache.expiry` is `null`,
# meaning cached tiles are NEVER time-based evicted (only evicted under
# memory pressure) — there is also no DB-change invalidation hook
# (maplibre/martin#1578). The `segment_flow` source is rebuilt from PostGIS
# by the ~5-minute congestion sweep, so without an expiry Martin would keep
# serving the FIRST sweep's colors forever once a tile is cached.
#
# `4m` sits just under that 5-min sweep cadence: a served tile is at most one
# sweep + one `expiry` window stale, and it re-synchronizes with the sweep
# cadence rather than drifting further behind. This is Martin's own internal
# cache (in front of PostGIS); it's separate from — and works together with
# — the shorter `Cache-Control: max-age=240` that Traefik stamps on
# `/martin/segment_flow` responses (`tiles-cache-live` middleware in
# services/traefik/config/dynamic/middlewares.yml), which controls how often
# *browsers* re-request instead of trusting their own cached copy.
cache:
  expiry: "4m"

# Traefik Static Configuration
# Reverse proxy for OpenMapX services.
# Routing is configured via Docker labels in docker-compose.yml.

api:
  dashboard: true
  insecure: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https

  websecure:
    address: ":443"
    # HTTP/3 (QUIC) over UDP/443. `advertisedPort` is the port announced to
    # clients in the Alt-Svc header; it must match the published UDP host port
    # (see services/traefik/service.json `exposure.hostPorts`). Clients still
    # negotiate over TCP/443 first, then upgrade to QUIC.
    http3:
      advertisedPort: 443
    http:
      tls:
        certResolver: letsencrypt
      # To gate the deployment behind basic auth, copy
      # `dynamic/auth.yml.example` to `dynamic/auth.yml` (set credentials
      # there) and add `middlewares: [basic-auth@file]` here. Without that
      # opt-in, the default config exposes the stack publicly — every
      # router referenced by `basic-auth@file` would otherwise 404 because
      # the middleware doesn't exist on a fresh deployment.

certificatesResolvers:
  letsencrypt:
    acme:
      storage: /etc/traefik/acme.json
      httpChallenge:
        entryPoint: web

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: docker_openmapx
  file:
    directory: /etc/traefik/dynamic
    watch: true

log:
  level: WARN

accessLog:
  bufferingSize: 100

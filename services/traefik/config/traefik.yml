# Traefik Static Configuration
# Reverse proxy for OpenMapX services.
# Routing is generated into the file provider's `dynamic/` directory.

api:
  dashboard: true
  insecure: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https

  websecure:
    address: ":443"
    # HTTP/3 (QUIC) over UDP/443. `advertisedPort` is the port announced to
    # clients in the Alt-Svc header; it must match the published UDP host port
    # (see services/traefik/service.json `exposure.hostPorts`). Clients still
    # negotiate over TCP/443 first, then upgrade to QUIC.
    http3:
      advertisedPort: 443
    http:
      middlewares:
        - hsts@file
      tls:
        certResolver: letsencrypt
      # To gate the deployment behind basic auth, copy
      # `dynamic/auth.yml.example` to `dynamic/auth.yml` (set credentials
      # there) and append `basic-auth@file` to the existing middleware list.
      # Without that
      # opt-in, the default config exposes the stack publicly — every
      # router referenced by `basic-auth@file` would otherwise 404 because
      # the middleware doesn't exist on a fresh deployment.

certificatesResolvers:
  letsencrypt:
    acme:
      storage: /etc/traefik/acme.json
      httpChallenge:
        entryPoint: web

# Routing is generated from validated first-party service manifests into
# `dynamic/`. Traefik holds no Docker socket: an internet-facing reverse proxy
# with host authority is the exact escape this removes. Community services never
# receive a platform route.
providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true

log:
  level: WARN

accessLog:
  bufferingSize: 100
  format: json
  # Calendar dates are part of personal-timeline request paths. Keep only
  # privacy-safe operational dimensions; never retain path, request line,
  # headers, or query parameters in the default production access log.
  fields:
    defaultMode: drop
    names:
      RequestMethod: keep
      RouterName: keep
      DownstreamStatus: keep
      Duration: keep
    queryParameters:
      defaultMode: drop

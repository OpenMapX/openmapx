server {
    listen 80;

    # Rendered at container start from the service settings by app-links.sh.
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        alias /var/lib/openmapx/app-links/apple-app-site-association;
    }

    location = /.well-known/assetlinks.json {
        default_type application/json;
        alias /var/lib/openmapx/app-links/assetlinks.json;
    }

    location / {
        return 404;
    }
}

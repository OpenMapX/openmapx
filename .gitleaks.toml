# gitleaks configuration for OpenMapX.
# Extends the default ruleset and allowlists known non-secrets so history scans
# (and any future gitleaks CI / GitHub secret scanning) stay clean.
#
# Scan locally with:  gitleaks detect --redact

[extend]
useDefault = true

[allowlist]
description = "Known non-secrets: intentionally public open-data credentials"
regexes = [
  # NRW.Mobidrom GBFS API: the Keycloak client secret is published openly on the
  # public dataset page for any API consumer (see nrw-mobidrom-client.ts header).
  # It is a documented public credential, not a secret; overridable via env.
  '''OhQP9ryrXU7lnjQ9qteZib3rnys2wkTB''',
]

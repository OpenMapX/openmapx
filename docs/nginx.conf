server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

  # Hashed, content-addressed assets — cache hard.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Self-hosted fonts.
  location /fonts/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Docusaurus emits one HTML file per route; unknown paths get a real 404
  # status, served with Docusaurus's own 404 page.
  location / {
    try_files $uri $uri/ $uri.html =404;
  }

  error_page 404 /404.html;
}
